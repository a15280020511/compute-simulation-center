name: Unique Compute Tools Canary

on:
  pull_request:
    paths:
      - "compute-center/canaries/unique_compute_tools_canary.py"
      - "compute-center/capability-gap-audit-20260805.json"
      - ".github/workflows/unique-compute-tools-canary.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/canaries/unique_compute_tools_canary.py"
      - "compute-center/capability-gap-audit-20260805.json"
      - ".github/workflows/unique-compute-tools-canary.yml"

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated pinned candidates
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            cvc5==1.3.4 \
            python-flint==0.9.0
          python -m pip check
      - name: Compile canary
        run: python -m py_compile compute-center/canaries/unique_compute_tools_canary.py
      - name: Run deterministic canary
        run: python compute-center/canaries/unique_compute_tools_canary.py | tee unique-compute-tools-canary.json
      - name: Upload canary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unique-compute-tools-canary-${{ github.run_id }}
          path: unique-compute-tools-canary.json
          if-no-files-found: error
          retention-days: 30
