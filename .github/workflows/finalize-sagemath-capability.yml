name: Finalize SageMath Capability

on:
  push:
    branches: [feat/sagemath-capability-20260804]
    paths:
      - maintenance/repair_and_apply_sagemath.py
      - .github/workflows/finalize-sagemath-capability.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-sagemath-capability
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/sagemath-capability-20260804
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve image, generate capability and preserve diagnostics
        id: generate
        continue-on-error: true
        run: |
          set +e
          mkdir -p maintenance
          exec > >(tee maintenance/sagemath-migration-diagnostics.txt) 2>&1
          echo "stage=resolve-image"
          docker pull sagemath/sagemath:10.9
          pull_rc=$?
          echo "docker_pull_exit=$pull_rc"
          if [[ $pull_rc -ne 0 ]]; then exit $pull_rc; fi
          digest="$(docker image inspect sagemath/sagemath:10.9 --format '{{index .RepoDigests 0}}')"
          digest_rc=$?
          echo "digest_exit=$digest_rc"
          echo "digest=$digest"
          if [[ $digest_rc -ne 0 || -z "$digest" ]]; then exit 31; fi
          version="$(docker run --rm --network none --entrypoint sage sagemath/sagemath:10.9 --version | head -n 1)"
          version_rc=$?
          echo "version_exit=$version_rc"
          echo "version=$version"
          if [[ $version_rc -ne 0 || -z "$version" ]]; then exit 32; fi
          export SAGEMATH_IMAGE_DIGEST="$digest"
          export SAGEMATH_VERSION="$version"
          echo "stage=generate"
          python maintenance/repair_and_apply_sagemath.py
          generate_rc=$?
          echo "generator_exit=$generate_rc"
          exit $generate_rc
      - name: Commit failure diagnostics
        if: steps.generate.outcome != 'success'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add maintenance/sagemath-migration-diagnostics.txt
          git commit -m 'chore: record SageMath migration failure diagnostics' || true
          git push origin HEAD:feat/sagemath-capability-20260804
      - name: Install compute dependencies and validate generated code
        id: validate
        if: steps.generate.outcome == 'success'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m py_compile compute-center/sagemath_operations.py compute-center/capability_manager.py compute-center/tool_registry.py compute-center/systems_matrix.py
          python -m unittest discover -s compute-center/tests -p 'test_sagemath_operations.py' -v
          python compute-center/tool_registry.py validate
          python compute-center/systems_matrix.py validate
      - name: Execute all six modes in the exact-digest offline runtime
        if: steps.generate.outcome == 'success'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'compute-center')
          import sagemath_operations as s
          samples=[
            {'mode':'simplify','variables':['x'],'expression':'(x^2-1)/(x-1)'},
            {'mode':'solve','variables':['x'],'variable':'x','expression':'x^2-4'},
            {'mode':'differentiate','variables':['x'],'variable':'x','expression':'sin(x)*exp(x)','order':2},
            {'mode':'integrate','variables':['x'],'variable':'x','expression':'x^2','lower':0,'upper':1},
            {'mode':'matrix_analysis','matrix':[[1,2],[3,4]]},
            {'mode':'number_theory','action':'factor','values':[360]},
          ]
          rows=[]
          for sample in samples:
              out=s.symbolic_mathematics(sample)
              assert out['engine']=='SageMath'
              assert out['runtime']['network_policy']=='none'
              rows.append({'mode':out['mode'],'result':out['result']})
          open('sagemath-validation.json','w').write(json.dumps({'status':'PASS','model_calls':0,'external_data_fetches':0,'modes':rows},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit formal production capability
        if: steps.generate.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compute-center sagemath-validation.json
          if git diff --cached --quiet; then
            echo 'No formal capability changes generated'
            exit 1
          fi
          git commit -m 'feat: add pinned offline SageMath symbolic capability'
          git push origin HEAD:feat/sagemath-capability-20260804
      - name: Fail when generation failed
        if: steps.generate.outcome != 'success'
        run: exit 1
