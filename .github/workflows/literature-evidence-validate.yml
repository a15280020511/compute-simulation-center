name: Literature Evidence Validate

on:
  pull_request:
    paths:
      - 'compute-center/literature-evidence/**'
      - 'compute-center/literature-evidence-ticket.schema.json'
      - 'compute-center/tests/test_literature_ticket.py'
      - 'compute-center/LITERATURE_DEPENDENCIES.md'
      - '.github/workflows/literature-evidence-ticket.yml'
      - '.github/workflows/literature-evidence-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed ticket-validation dependency
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Compile validate and test the isolated literature plane
        run: |
          python -m compileall -q compute-center/literature-evidence
          PYTHONPATH=compute-center/literature-evidence \
            python -m unittest compute-center/tests/test_literature_ticket.py -v
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          schema = Path('compute-center/literature-evidence-ticket.schema.json')
          json.loads(schema.read_text(encoding='utf-8'))
          path = Path('compute-center/literature-evidence/literature_evidence.py')
          spec = importlib.util.spec_from_file_location('lit', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              module._get('https://example.com/x')
          except module.LiteratureEvidenceError:
              pass
          else:
              raise SystemExit('literature host allowlist failed')
          PY
