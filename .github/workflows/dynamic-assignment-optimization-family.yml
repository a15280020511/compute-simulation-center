name: Validate Dynamic Assignment Optimization Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_assignment_optimization_planner.py"
      - "compute-center/dynamic_assignment_optimization_adapters.py"
      - "compute-center/dynamic-assignment-optimization-policy.json"
      - "compute-center/dynamic-assignment-optimization-capability-graph.json"
      - "compute-center/dynamic-assignment-optimization-stage-contracts.json"
      - "compute-center/operations_research_modes.py"
      - "compute-center/requirements-ortools.txt"
      - "compute-center/validate_dynamic_assignment_optimization.py"
      - "compute-center/tests/test_dynamic_assignment_optimization_family.py"
      - "compute-center/tests/test_dynamic_assignment_optimization_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-assignment-optimization-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-assignment-optimization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
      - name: Install core and assignment-optimization dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          assert version("scipy") == "1.18.0"
          PY
      - name: Compile assignment-optimization dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_assignment_optimization_adapters.py \
            dynamic_assignment_optimization_planner.py \
            operations_research_modes.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            operation_validation.py \
            validate_dynamic_assignment_optimization.py \
            tests/test_dynamic_assignment_optimization_family.py \
            tests/test_dynamic_assignment_optimization_router_coexistence.py
      - name: Run assignment-optimization and existing lightweight dynamic regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_dynamic*.py' -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for assignment-optimization family
        working-directory: compute-center
        run: python validate_dynamic_assignment_optimization.py
