name: Apply Scalable Data Patch

on:
  push:
    branches:
      - feature/scalable-data-intelligence-20260805
    paths:
      - tools/apply_scalable_data_patch.py
      - tools/apply_scalable_data_patch_v2.py
      - .github/workflows/apply-scalable-data-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-scalable-data-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/scalable-data-intelligence-20260805
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply repository patch
        run: python tools/apply_scalable_data_patch_v2.py
      - name: Validate new module and registry
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m py_compile compute-center/large_scale_data_intelligence_operations.py
          python -m unittest compute-center/tests/test_large_scale_data_intelligence.py -v
          python compute-center/tool_registry.py validate
          git diff --check
      - name: Commit generated implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compute-center SCALABLE_DATA_INTELLIGENCE.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: add scalable data intelligence modes"
          git push origin HEAD:feature/scalable-data-intelligence-20260805
