name: Validate Transport Forecast Pack

on:
  pull_request:
    paths:
      - 'compute-center/transport_forecast_operations.py'
      - 'compute-center/requirements-sumo.txt'
      - 'compute-center/requirements-statsforecast.txt'
      - 'compute-center/tool-registry.json'
      - 'compute-center/compute-capabilities.json'
      - 'compute-center/compute-ticket.schema.json'
      - 'compute-center/systems-computation-matrix.json'
      - 'compute-center/model-registry.json'
      - 'compute-center/tests/test_transport_forecast_operations.py'
      - '.github/workflows/transport-forecast-validate.yml'
  push:
    branches: [main]
    paths:
      - 'compute-center/transport_forecast_operations.py'
      - 'compute-center/requirements-sumo.txt'
      - 'compute-center/requirements-statsforecast.txt'
      - 'compute-center/tool-registry.json'
      - 'compute-center/compute-capabilities.json'
      - 'compute-center/compute-ticket.schema.json'
      - 'compute-center/systems-computation-matrix.json'
      - 'compute-center/model-registry.json'
      - 'compute-center/tests/test_transport_forecast_operations.py'
      - '.github/workflows/transport-forecast-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-forecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install core registry dependency
        run: python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
      - name: Validate registry contracts
        working-directory: compute-center
        run: |
          python capability_manager.py validate
          python systems_matrix.py validate
          python - <<'PY'
          import json
          from capability_manager import requirements_for_ticket, runtime_plan
          for mode, expected in [
              ('sumo_micro_simulation', 'requirements-sumo.txt'),
              ('statsforecast_batch', 'requirements-statsforecast.txt'),
          ]:
              ticket={'operation':'transport_forecast_analysis','inputs':{'mode':mode}}
              paths=requirements_for_ticket(ticket)
              assert len(paths)==1 and paths[0].endswith(expected)
              plan=runtime_plan(ticket)
              assert plan['network_policy']=='deny'
              assert plan['arbitrary_code_allowed'] is False
              assert plan['maturity']=='controlled-preview'
          schema=json.load(open('compute-ticket.schema.json'))
          assert 'transport_forecast_analysis' in schema['properties']['operation']['enum']
          catalog=json.load(open('compute-capabilities.json'))
          rows={row['id']:row for row in catalog['operations']}
          assert rows['transport_forecast_analysis']['modes']==['sumo_micro_simulation','statsforecast_batch']
          PY
          git diff --check

  statsforecast-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-statsforecast.txt
      - name: Install fixed dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt -r compute-center/requirements-statsforecast.txt
          python -m pip check
      - name: Execute fixed forecast tests
        working-directory: compute-center
        run: |
          python -m py_compile transport_forecast_operations.py
          python -m unittest tests.test_transport_forecast_operations.TransportForecastTests.test_statsforecast_naive_forecast_is_bounded tests.test_transport_forecast_operations.TransportForecastTests.test_statsforecast_rejects_unknown_models
          python - <<'PY'
          import json, statsforecast
          from transport_forecast_operations import statsforecast_batch
          rows=[{'unique_id':'a','ds':f'2026-01-{d:02d}','y':float(d)} for d in range(1,16)]
          result=statsforecast_batch({'series':rows,'frequency':'D','horizon':3,'season_length':1,'models':['Naive','AutoETS'],'levels':[80]})
          receipt={'status':'PASS','engine_version':statsforecast.__version__,'rows':len(result['forecast_rows']),'network_used':False,'model_calls':0}
          open('statsforecast-receipt.json','w').write(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statsforecast-real-${{ github.run_id }}
          path: compute-center/statsforecast-receipt.json
          if-no-files-found: error
          retention-days: 30

  sumo-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-sumo.txt
      - name: Install fixed dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt -r compute-center/requirements-sumo.txt
          python -m pip check
      - name: Execute tiny deterministic corridor
        working-directory: compute-center
        run: |
          python -m py_compile transport_forecast_operations.py
          python -m unittest tests.test_transport_forecast_operations.TransportForecastTests.test_sumo_tiny_corridor_runs_without_external_paths
          python - <<'PY'
          import json, sumo
          from transport_forecast_operations import sumo_micro_simulation
          inputs={'nodes':[{'id':'n0','x':0.0,'y':0.0},{'id':'n1','x':100.0,'y':0.0},{'id':'n2','x':200.0,'y':0.0}], 'edges':[{'id':'e0','from':'n0','to':'n1','lanes':1,'speed_mps':13.89},{'id':'e1','from':'n1','to':'n2','lanes':1,'speed_mps':13.89}], 'routes':[{'id':'r0','edges':['e0','e1']}], 'flows':[{'id':'f0','route':'r0','begin':0,'end':120,'vehicles_per_hour':360}], 'duration_seconds':180,'seed':42,'timeout_seconds':60}
          first=sumo_micro_simulation(inputs); second=sumo_micro_simulation(inputs)
          keys=['completed_trips','mean_trip_duration_seconds','mean_route_length_meters','mean_waiting_time_seconds','mean_time_loss_seconds']
          assert {k:first[k] for k in keys}=={k:second[k] for k in keys}
          receipt={'status':'PASS','sumo_home_present':bool(sumo.SUMO_HOME),'deterministic_repeat':True,'completed_trips':first['completed_trips'],'network_used':False,'model_calls':0}
          open('sumo-receipt.json','w').write(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumo-real-${{ github.run_id }}
          path: compute-center/sumo-receipt.json
          if-no-files-found: error
          retention-days: 30
