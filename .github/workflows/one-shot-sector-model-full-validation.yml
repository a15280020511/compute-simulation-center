name: One Shot Full Sector Model Validation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: one-shot-sector-model-full-validation
  cancel-in-progress: false

jobs:
  validate-mode:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-sector-model-full-validate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: doubleml_plr
            requirements: requirements-sector-causal-econ.txt
          - mode: quantecon_markov_chain
            requirements: requirements-sector-causal-econ.txt
          - mode: nash_bimatrix_equilibria
            requirements: requirements-sector-causal-econ.txt
          - mode: ema_robust_regret
            requirements: requirements-sector-causal-econ.txt
          - mode: pypsa_linear_power_flow
            requirements: requirements-sector-energy.txt
          - mode: pandapower_ac_power_flow
            requirements: requirements-sector-grid.txt
          - mode: wntr_hydraulic_snapshot
            requirements: requirements-sector-water.txt
          - mode: pywr_resource_allocation
            requirements: requirements-sector-water.txt
          - mode: gstools_random_field
            requirements: requirements-sector-geostat.txt
          - mode: pykrige_interpolation
            requirements: requirements-sector-geostat.txt
          - mode: brightway_matrix_lca
            requirements: requirements-sector-lca.txt
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sector-model-toolkit-20260803
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/${{ matrix.requirements }}
      - name: Install one isolated bundle
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/${{ matrix.requirements }}
          python -m pip check
      - name: Compile and execute numerical validation
        run: |
          set -euo pipefail
          python -m py_compile compute-center/sector_model_operations.py compute-center/validate_sector_model_pack.py
          mkdir -p sector-model-full-validation
          python compute-center/validate_sector_model_pack.py \
            --mode "${{ matrix.mode }}" \
            --output "sector-model-full-validation/${{ matrix.mode }}.json"
      - name: Upload mode evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: one-shot-sector-model-${{ matrix.mode }}-${{ github.run_id }}
          path: sector-model-full-validation/
          if-no-files-found: error
          retention-days: 30

  report:
    if: always() && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[maintenance-sector-model-full-validate]')
    needs: [validate-mode]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Report aggregate result
        run: |
          if [ "${{ needs.validate-mode.result }}" = "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "SECTOR_MODEL_FULL_VALIDATION_PASS modes=11 network=deny model_calls=0"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "SECTOR_MODEL_FULL_VALIDATION_FAILED run=${GITHUB_RUN_ID}"
            exit 1
          fi
