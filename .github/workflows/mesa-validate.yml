name: Validate Mesa Compute Engine

on:
  pull_request:
    paths:
      - "compute-center/mesa_operations.py"
      - "compute-center/requirements-mesa.txt"
      - "compute-center/tests/test_mesa_operations.py"
      - "compute-center/compute_dispatch.py"
      - "compute-center/compute-ticket.schema.json"
      - "compute-center/compute-capabilities.json"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/mesa-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/mesa_operations.py"
      - "compute-center/requirements-mesa.txt"
      - "compute-center/tests/test_mesa_operations.py"
      - "compute-center/compute_dispatch.py"
      - "compute-center/compute-ticket.schema.json"
      - "compute-center/compute-capabilities.json"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/mesa-validate.yml"
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * 0"

permissions:
  contents: read

concurrency:
  group: validate-mesa-compute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mesa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-mesa.txt

      - name: Initialize Mesa evidence directory
        run: mkdir -p mesa-validation-artifacts

      - name: Install isolated Mesa environment
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements-mesa.txt
            python -m pip check
          } 2>&1 | tee mesa-validation-artifacts/install.log

      - name: Run Mesa unit and reproducibility tests
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile compute-center/mesa_operations.py compute-center/tests/test_mesa_operations.py
            python -m unittest discover -s compute-center/tests -p 'test_mesa_operations.py' -v
          } 2>&1 | tee mesa-validation-artifacts/unit-tests.log

      - name: Run full Mesa dispatcher probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mesa-ticket.json <<'JSON'
          {
            "task_id": "mesa-validation-20260728",
            "objective": "Validate isolated bounded Mesa execution",
            "operation": "agent_based_simulation",
            "inputs": {
              "mode": "heterogeneous_worker_choice",
              "agent_count": 100,
              "steps": 25,
              "seed": 20260728,
              "learning_rate": 0.2,
              "choice_sensitivity": 2.0,
              "switching_cost": 0.5,
              "options": [
                {"name": "zone_a", "base_reward": 20, "cost": 5, "capacity": 45, "congestion_penalty": 8},
                {"name": "zone_b", "base_reward": 18, "cost": 3, "capacity": 70, "congestion_penalty": 4}
              ]
            }
          }
          JSON
          python compute-center/compute_dispatch.py \
            --ticket /tmp/mesa-ticket.json \
            --output-dir mesa-validation-artifacts/probe \
            2>&1 | tee mesa-validation-artifacts/mesa-validation.log
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("mesa-validation-artifacts/probe")
          result = json.loads((root / "compute-result.json").read_text(encoding="utf-8"))
          assert result["status"] == "success"
          assert result["operation"] == "agent_based_simulation"
          assert result["results"]["engine"]["name"] == "mesa"
          assert result["results"]["engine"]["version"] == "3.5.1"
          assert result["results"]["engine"]["arbitrary_agent_code"] is False
          assert result["execution"]["network_used"] is False
          assert abs(sum(result["results"]["final_shares"]) - 1.0) < 1e-12
          manifest = json.loads((root / "artifact-manifest.json").read_text(encoding="utf-8"))
          assert {"compute-result.json", "compute-audit.json", "compute-diagnostics.json"} <= {row["path"] for row in manifest["files"]}
          PY

      - name: Verify core environment remains independent
        run: |
          python - <<'PY'
          from pathlib import Path
          core = Path("compute-center/requirements.txt").read_text(encoding="utf-8").lower()
          optional = Path("compute-center/requirements-mesa.txt").read_text(encoding="utf-8").lower()
          assert "mesa==" not in core
          assert "mesa==3.5.1" in optional
          assert "mesa[" not in optional
          print("Mesa isolation contract: PASS")
          PY

      - name: Upload Mesa validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesa-compute-validation-${{ github.run_id }}
          path: mesa-validation-artifacts/
          if-no-files-found: error
          retention-days: 30
