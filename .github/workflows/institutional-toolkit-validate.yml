name: Validate Exa Institutional Toolkit

on:
  pull_request:
    paths:
      - "compute-center/**"
      - ".github/workflows/institutional-toolkit-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/**"
      - ".github/workflows/institutional-toolkit-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: institutional-toolkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-institutional-economics.txt
            compute-center/requirements-institutional-forecasting.txt
            compute-center/requirements-institutional-decision.txt
            compute-center/requirements-institutional-spatial.txt
            compute-center/requirements-institutional-energy.txt
            compute-center/requirements-institutional-climate-health.txt
            compute-center/requirements-institutional-finance.txt
            compute-center/requirements-institutional-knowledge.txt
            compute-center/requirements-institutional-engineering.txt
            compute-center/requirements-institutional-assurance.txt
      - run: python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
      - run: python -m py_compile compute-center/*.py compute-center/tests/*.py
      - run: python compute-center/institutional_toolkit_registry_validate.py
      - run: python -m unittest compute-center/tests/test_institutional_toolkit.py -v
      - run: python compute-center/capability_manager.py validate
      - run: python compute-center/tool_registry.py validate

  pack-validation:
    needs: registry-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pack: economics
            requirements: requirements-institutional-economics.txt
          - pack: forecasting
            requirements: requirements-institutional-forecasting.txt
          - pack: decision
            requirements: requirements-institutional-decision.txt
          - pack: spatial
            requirements: requirements-institutional-spatial.txt
          - pack: energy
            requirements: requirements-institutional-energy.txt
          - pack: climate-health
            requirements: requirements-institutional-climate-health.txt
          - pack: finance
            requirements: requirements-institutional-finance.txt
          - pack: knowledge
            requirements: requirements-institutional-knowledge.txt
          - pack: engineering
            requirements: requirements-institutional-engineering.txt
          - pack: assurance
            requirements: requirements-institutional-assurance.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/${{ matrix.requirements }}
      - name: Install isolated capability pack
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/${{ matrix.requirements }}
          python -m pip check
      - name: Validate every mode in pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p institutional-validation
          python compute-center/validate_institutional_toolkit_packs.py \
            --pack "${{ matrix.pack }}" \
            --output "institutional-validation/${{ matrix.pack }}.json"
      - name: Prove offline and zero-model contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pack = "${{ matrix.pack }}"
          result = json.loads(Path(f"institutional-validation/{pack}.json").read_text(encoding="utf-8"))
          assert result["status"] == "PASS"
          assert result["network_used"] is False
          assert result["external_data_fetches"] == 0
          assert result["model_calls"] == 0
          assert result["brokerage_execution"] is False
          assert result["arbitrary_code_allowed"] is False
          assert result["mode_count"] > 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: institutional-${{ matrix.pack }}-${{ github.run_id }}
          path: institutional-validation/
          if-no-files-found: warn
          retention-days: 30
