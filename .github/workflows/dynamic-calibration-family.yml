name: Validate Dynamic Calibration Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_calibration_planner.py"
      - "compute-center/dynamic_calibration_adapters.py"
      - "compute-center/dynamic-calibration-policy.json"
      - "compute-center/dynamic-calibration-capability-graph.json"
      - "compute-center/dynamic-calibration-stage-contracts.json"
      - "compute-center/think_tank_global_operations.py"
      - "compute-center/requirements-global-lmfit.txt"
      - "compute-center/validate_dynamic_calibration.py"
      - "compute-center/tests/test_dynamic_calibration_family.py"
      - "compute-center/tests/test_dynamic_family_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-calibration-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-calibration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-global-lmfit.txt
      - name: Install core and calibration dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt \
            -r compute-center/requirements-global-lmfit.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          assert version("lmfit") == "1.3.4"
          PY
      - name: Compile calibration dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_calibration_adapters.py \
            dynamic_calibration_planner.py \
            think_tank_global_operations.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            operation_validation.py \
            validate_dynamic_calibration.py \
            tests/test_dynamic_calibration_family.py \
            tests/test_dynamic_family_router_coexistence.py
      - name: Run calibration and existing lightweight dynamic regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_dynamic*.py' -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for calibration family
        working-directory: compute-center
        run: python validate_dynamic_calibration.py
