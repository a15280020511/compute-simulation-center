name: Validate Dynamic Reliability Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_reliability_planner.py"
      - "compute-center/dynamic_reliability_adapters.py"
      - "compute-center/dynamic-reliability-policy.json"
      - "compute-center/dynamic-reliability-capability-graph.json"
      - "compute-center/dynamic-reliability-stage-contracts.json"
      - "compute-center/tool_registry.py"
      - "compute-center/compute_runner.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/think_tank_global_operations.py"
      - "compute-center/validate_dynamic_reliability.py"
      - "compute-center/tests/test_dynamic_reliability_family.py"
      - "compute-center/tests/test_dynamic_family_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-reliability-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-global-openturns.txt
      - name: Install core optimization and reliability dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt \
            -r compute-center/requirements-global-openturns.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          assert version("openturns")
          PY
      - name: Compile reliability dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_reliability_adapters.py \
            dynamic_reliability_planner.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            tool_registry.py \
            validate_dynamic_reliability.py \
            tests/test_dynamic_reliability_family.py \
            tests/test_dynamic_family_router_coexistence.py
      - name: Run reliability and existing dynamic-family regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_dynamic_reliability_family \
            tests.test_dynamic_family_router_coexistence \
            tests.test_dynamic_state_estimation_family \
            tests.test_dynamic_bayesian_network_family \
            tests.test_dynamic_time_series_family \
            tests.test_dynamic_pipeline_planner \
            tests.test_dynamic_runtime_integration \
            tests.test_dynamic_generic_extensions -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for reliability family
        working-directory: compute-center
        run: python validate_dynamic_reliability.py
