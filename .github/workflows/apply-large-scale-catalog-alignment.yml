name: Apply Large Scale Catalog Alignment

on:
  push:
    branches:
      - feature/scalable-data-intelligence-20260805
    paths:
      - tools/align_large_scale_catalogs.py
      - .github/workflows/apply-large-scale-catalog-alignment.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-large-scale-catalog-alignment
  cancel-in-progress: false

jobs:
  align:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/scalable-data-intelligence-20260805
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Align catalogs
        run: python tools/align_large_scale_catalogs.py
      - name: Validate catalog consistency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python compute-center/tool_registry.py validate
          python compute-center/capability_manager.py validate
          python compute-center/governance_catalog.py
          python -m unittest compute-center/tests/test_capability_manager_v2.py compute-center/tests/test_governance_catalogs.py compute-center/tests/test_large_scale_data_intelligence.py -v
          git diff --check
      - name: Commit aligned catalogs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compute-center/compute-ticket.schema.json compute-center/model-registry.json compute-center/tests/test_capability_manager_v2.py
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "fix: align large-scale operation governance catalogs"
          git push origin HEAD:feature/scalable-data-intelligence-20260805
