name: Sync Transport Forecast Registry From PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-transport-forecast-registry-pr
  cancel-in-progress: false

jobs:
  sync:
    if: github.head_ref == 'feat/sumo-statsforecast-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sumo-statsforecast-20260803
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute repository-controlled registry mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/transport-forecast-registry-sync.yml').read_text(encoding='utf-8')
          start=source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end=source.index("\n          PY\n", start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          exec(compile(code, 'transport-forecast-registry-sync', 'exec'), {})
          PY
      - name: Install registry validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
      - name: Validate every governance surface
        working-directory: compute-center
        run: |
          python -m py_compile *.py tests/*.py
          python capability_manager.py validate
          python systems_matrix.py validate
          python governance_catalog.py
          python -m unittest tests.test_capability_manager_v2 tests.test_tool_registry tests.test_governance_catalogs tests.test_governance_v2
          git -C .. diff --check
      - name: Commit non-workflow governance files
        run: |
          git checkout -- .github/workflows/compute-all-operations-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            compute-center/tool-registry.json \
            compute-center/compute-capabilities.json \
            compute-center/systems-computation-matrix.json \
            compute-center/compute-ticket.schema.json \
            compute-center/model-registry.json \
            compute-center/transport_forecast_operations.py \
            compute-center/tests/test_tool_registry.py \
            compute-center/tests/test_capability_manager_v2.py \
            compute-center/tests/test_governance_catalogs.py \
            compute-center/tests/test_governance_v2.py \
            compute-center/validate_all_operations.py
          if git diff --cached --quiet; then
            echo 'Compute governance files already synchronized'
            exit 0
          fi
          git commit -m 'feat: register SUMO and StatsForecast compute capability'
          git push origin HEAD:feat/sumo-statsforecast-20260803
