name: Validate Dynamic Optimization Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_optimization_planner.py"
      - "compute-center/dynamic_optimization_adapters.py"
      - "compute-center/dynamic-optimization-policy.json"
      - "compute-center/dynamic-optimization-capability-graph.json"
      - "compute-center/dynamic-optimization-stage-contracts.json"
      - "compute-center/operations_research_modes.py"
      - "compute-center/think_tank_decision_operations.py"
      - "compute-center/assurance_operations.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/tool_registry.py"
      - "compute-center/compute_runner.py"
      - "compute-center/validate_dynamic_optimization.py"
      - "compute-center/tests/test_dynamic_optimization_family.py"
      - "compute-center/tests/test_dynamic_family_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-optimization-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-optimization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-thinktank-decision.txt
      - name: Install core and optimization cross-check dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt \
            -r compute-center/requirements-thinktank-decision.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          assert version("pyomo") == "6.10.1"
          assert version("highspy") == "1.15.1"
          PY
      - name: Compile optimization dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_optimization_adapters.py \
            dynamic_optimization_planner.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            tool_registry.py \
            validate_dynamic_optimization.py \
            tests/test_dynamic_optimization_family.py \
            tests/test_dynamic_family_router_coexistence.py
      - name: Run optimization and existing dynamic-family regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_dynamic_optimization_family \
            tests.test_dynamic_family_router_coexistence \
            tests.test_dynamic_reliability_family \
            tests.test_dynamic_state_estimation_family \
            tests.test_dynamic_bayesian_network_family \
            tests.test_dynamic_time_series_family \
            tests.test_dynamic_pipeline_planner \
            tests.test_dynamic_runtime_integration \
            tests.test_dynamic_generic_extensions -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for optimization family
        working-directory: compute-center
        run: python validate_dynamic_optimization.py
