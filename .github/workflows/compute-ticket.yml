name: Independent Compute Center

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  execute-compute:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[compute]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: compute-numeric-offline
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-finance.txt
            compute-center/requirements-mesa.txt
            compute-center/requirements-missing-data.txt
            compute-center/requirements-diffusion.txt
            compute-center/requirements-causal.txt
            compute-center/requirements-bayesian-network.txt
            compute-center/requirements-calibration.txt
            compute-center/requirements-constraints.txt

      - name: Install isolated core compute dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt

      - name: Compile compute module only
        run: python -m py_compile compute-center/*.py

      - name: Parse authorize validate and de-duplicate compute ticket
        id: prepare
        continue-on-error: true
        run: |
          python compute-center/compute_ticket.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir compute-artifacts

      - name: Resolve and install managed capability dependencies
        if: steps.prepare.outputs.accepted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python compute-center/tool_registry.py plan \
            --ticket compute-artifacts/ticket.json \
            > compute-artifacts/compute-runtime-plan.json
          mapfile -t requirement_files < <(
            python compute-center/tool_registry.py requirements \
              --ticket compute-artifacts/ticket.json
          )
          for requirement in "${requirement_files[@]}"; do
            python -m pip install --disable-pip-version-check --no-input -r "$requirement"
          done
          python -m pip check

      - name: Comment compute ticket accepted
        if: steps.prepare.outputs.accepted == 'true'
        run: |
          python compute-center/compute_ticket.py render \
            --phase accepted \
            --output-dir compute-artifacts \
            --run-url "$RUN_URL" > compute-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@compute-comment.md

      - name: Comment compute ticket rejected
        if: steps.prepare.outputs.accepted != 'true'
        run: |
          python compute-center/compute_ticket.py render \
            --phase rejected \
            --output-dir compute-artifacts \
            --run-url "$RUN_URL" > compute-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@compute-comment.md

      - name: Execute compute inside an OS network namespace
        id: execute
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)"
          WORKSPACE="$GITHUB_WORKSPACE"
          sudo unshare --net --mount-proc bash -c "
            set -euo pipefail
            cd '$WORKSPACE'
            '$PYTHON_BIN' compute-center/network_assurance.py \
              --output compute-artifacts/compute-network-assurance.json
            set -o pipefail
            '$PYTHON_BIN' compute-center/compute_dispatch.py \
              --ticket compute-artifacts/ticket.json \
              --output-dir compute-artifacts \
              2>&1 | tee compute-artifacts/compute-console.log
          "

      - name: Restore runner ownership after isolated execution
        id: restore_ownership
        if: always() && steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -d compute-artifacts
          if find compute-artifacts -type l -print -quit | grep -q .; then
            echo "symbolic links are forbidden in compute artifacts" >&2
            exit 1
          fi
          sudo chown -R -- "$(id -u):$(id -g)" compute-artifacts
          test -w compute-artifacts
          if [[ -e compute-artifacts/artifact-manifest.json ]]; then
            test -w compute-artifacts/artifact-manifest.json
          fi

      - name: Refresh Artifact manifest after console capture
        id: refresh_manifest
        if: always() && steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("compute-artifacts")
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "artifact-manifest.json":
                  rows.append({
                      "path": str(path.relative_to(root)),
                      "size_bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          manifest = {"version": 1, "created_at": datetime.now(timezone.utc).isoformat(), "files": rows}
          (root / "artifact-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Upload independent compute Artifact
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compute-ticket-${{ github.event.issue.number }}-${{ github.run_id }}
          path: compute-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified status or explicitly public result
        id: publish_success
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.execute.outcome == 'success' &&
          steps.restore_ownership.outcome == 'success' &&
          steps.refresh_manifest.outcome == 'success' &&
          steps.upload.outcome == 'success' &&
          steps.upload.outputs['artifact-id'] != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_URL: ${{ steps.upload.outputs['artifact-url'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          rm -rf compute-public-comments
          mkdir -p compute-public-comments
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("compute-artifacts")
          result = json.loads((root / "compute-result.json").read_text(encoding="utf-8"))
          ticket = json.loads((root / "ticket.json").read_text(encoding="utf-8"))
          policy = ((ticket.get("quality_profile") or {}).get("publication_policy") or "artifact_only")
          payload = json.dumps(result, ensure_ascii=False, indent=2)
          digest = hashlib.sha256(payload.encode("utf-8")).hexdigest()
          run_id = os.environ["GITHUB_RUN_ID"]
          files = []

          if policy == "public_result":
              limit = 45000
              chunks = [payload[index:index + limit] for index in range(0, len(payload), limit)] or [""]
              total = len(chunks)
              for index, chunk in enumerate(chunks, 1):
                  marker = f"<!-- compute-result-run:{run_id}:part:{index:03d} -->"
                  body = "\n".join([
                      marker,
                      f"## COMPUTE_COMPLETED {index}/{total}", "",
                      f"- Task ID: `{result['task_id']}`",
                      f"- Operation: `{result['operation']}`",
                      f"- Release: `{result.get('quality', {}).get('release_status')}`",
                      f"- Evidence maturity: `{result.get('quality', {}).get('observed_evidence_maturity')}`",
                      f"- Result SHA256: `{result['result_sha256']}`",
                      f"- Public payload SHA256: `{digest}`",
                      f"- Artifact ID: `{os.environ['ARTIFACT_ID']}`",
                      f"- Artifact digest: `{os.environ.get('ARTIFACT_DIGEST') or 'unknown'}`",
                      f"- Artifact: {os.environ.get('ARTIFACT_URL') or 'unavailable'}", "",
                      "```json", chunk, "```",
                  ])
                  path = Path("compute-public-comments") / f"compute-result-{index:03d}.md"
                  path.write_text(body, encoding="utf-8")
                  files.append(path.name)
          else:
              marker = f"<!-- compute-status-run:{run_id} -->"
              body = "\n".join([
                  marker, "## COMPUTE_COMPLETED", "",
                  f"- Task ID: `{result['task_id']}`",
                  f"- Operation: `{result['operation']}`",
                  f"- Publication policy: `{policy}`",
                  f"- Release: `{result.get('quality', {}).get('release_status')}`",
                  f"- Formal decision use allowed: `{str(bool(result.get('quality', {}).get('formal_decision_use_allowed'))).lower()}`",
                  f"- Evidence maturity: `{result.get('quality', {}).get('observed_evidence_maturity')}`",
                  f"- Result SHA256: `{result['result_sha256']}`",
                  f"- Package SHA256: `{result.get('package_sha256')}`",
                  f"- Artifact ID: `{os.environ['ARTIFACT_ID']}`",
                  f"- Artifact digest: `{os.environ.get('ARTIFACT_DIGEST') or 'unknown'}`",
                  f"- Artifact: {os.environ.get('ARTIFACT_URL') or 'unavailable'}",
                  "- Full result: `stored only in the verified Artifact`",
                  "- Model calls: `0`", "- External data fetches: `0`",
              ])
              path = Path("compute-public-comments/status.md")
              path.write_text(body, encoding="utf-8")
              files.append(path.name)

          Path("compute-public-comments/manifest.json").write_text(json.dumps({
              "version": 2,
              "publication_policy": policy,
              "result_sha256": result["result_sha256"],
              "public_payload_sha256": digest if policy == "public_result" else None,
              "comment_count": len(files),
              "files": files,
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > /tmp/trusted-compute-comments.txt
          while IFS= read -r comment_file; do
            marker="$(head -n 1 "compute-public-comments/$comment_file")"
            if grep -Fqx "$marker" /tmp/trusted-compute-comments.txt; then
              continue
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -F body=@"compute-public-comments/$comment_file"
          done < <(jq -r '.files[]' compute-public-comments/manifest.json)

      - name: Publish structured compute failure
        id: publish_failure
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          (steps.execute.outcome != 'success' ||
           steps.restore_ownership.outcome != 'success' ||
           steps.refresh_manifest.outcome != 'success' ||
           steps.upload.outcome != 'success' ||
           steps.upload.outputs['artifact-id'] == '')
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs['artifact-url'] }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          OWNERSHIP_OUTCOME: ${{ steps.restore_ownership.outcome }}
          MANIFEST_OUTCOME: ${{ steps.refresh_manifest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("compute-artifacts/compute-error.json")
          error = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {
              "error_type": "DeliveryFailure",
              "message": "compute execution or verified Artifact delivery did not complete",
              "retryable": True,
          }
          body = "\n".join([
              "## COMPUTE_FAILED", "",
              f"- Error type: `{error.get('error_type')}`",
              f"- Message: `{str(error.get('message') or 'unknown')[:4000]}`",
              f"- Retryable: `{str(bool(error.get('retryable'))).lower()}`",
              f"- Execute outcome: `{os.environ['EXECUTE_OUTCOME']}`",
              f"- Ownership restore outcome: `{os.environ['OWNERSHIP_OUTCOME']}`",
              f"- Manifest outcome: `{os.environ['MANIFEST_OUTCOME']}`",
              f"- Artifact upload outcome: `{os.environ['UPLOAD_OUTCOME']}`",
              "- Model calls: `0`", "- External data fetches: `0`",
              f"- Artifact: {os.environ.get('ARTIFACT_URL') or 'unavailable'}",
          ])
          Path("compute-final-comment.md").write_text(body, encoding="utf-8")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@compute-final-comment.md

      - name: Mark rejected or failed compute execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.execute.outcome != 'success' ||
           steps.restore_ownership.outcome != 'success' ||
           steps.refresh_manifest.outcome != 'success' ||
           steps.upload.outcome != 'success' ||
           steps.upload.outputs['artifact-id'] == '' ||
           (steps.prepare.outputs.accepted == 'true' && steps.publish_success.outcome != 'success'))
        run: exit 1
