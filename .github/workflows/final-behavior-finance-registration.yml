name: Register Final Behavior Finance Intelligence Pack

on:
  pull_request:
    paths:
      - "compute-center/register_final_behavior_finance_intelligence.py"
      - "compute-center/behavior_finance_intelligence_operations.py"
      - "compute-center/requirements-final-*.txt"
      - "compute-center/tests/test_behavior_finance_*.py"
      - ".github/workflows/final-behavior-finance-registration.yml"

permissions:
  contents: write

concurrency:
  group: register-final-behavior-finance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply deterministic registration
        run: |
          set -euo pipefail
          python compute-center/register_final_behavior_finance_intelligence.py
          # Workflow files are updated separately through the GitHub contents API.
          git restore .github/workflows/compute-ticket.yml

      - name: Validate generated control plane
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
          python -m py_compile \
            compute-center/behavior_finance_intelligence_operations.py \
            compute-center/strategic_policy_intelligence_operations.py \
            compute-center/register_final_behavior_finance_intelligence.py \
            compute-center/tests/test_behavior_finance_intelligence.py \
            compute-center/tests/test_behavior_finance_registry.py \
            compute-center/tests/test_strategic_policy_intelligence.py
          python compute-center/capability_manager.py validate
          python compute-center/systems_matrix.py validate
          python -m unittest \
            compute-center/tests/test_behavior_finance_intelligence.py \
            compute-center/tests/test_behavior_finance_registry.py \
            compute-center/tests/test_strategic_policy_intelligence.py -v
          git diff --check

      - name: Commit generated registration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            compute-center/strategic_policy_intelligence_operations.py \
            compute-center/tool-registry.json \
            compute-center/compute-capabilities.json \
            compute-center/tests/test_strategic_policy_intelligence.py
          if git diff --cached --quiet; then
            echo "registration already applied"
            exit 0
          fi
          git commit -m "feat: register final behavior finance intelligence modes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
