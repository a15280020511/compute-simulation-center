name: One-shot Strategic Policy Pack Registration

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: maintenance-strategic-policy-registration
  cancel-in-progress: false

jobs:
  register:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-strategic-policy-pack]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: feat/strategic-policy-intelligence-toolkit-20260803
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install control-plane dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check

      - name: Apply deterministic registration
        run: python compute-center/register_strategic_policy_pack.py

      - name: Validate control plane
        run: |
          set -euo pipefail
          python -m py_compile \
            compute-center/strategic_policy_intelligence_operations.py \
            compute-center/register_strategic_policy_pack.py \
            compute-center/think_tank_global_operations.py
          python compute-center/capability_manager.py validate > /tmp/capability-manager.json
          python compute-center/systems_matrix.py validate > /tmp/systems-matrix.json
          python compute-center/maintenance_audit.py --root . --output /tmp/maintenance-audit.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/capability-manager.json'))['status'] == 'PASS'
          assert json.load(open('/tmp/systems-matrix.json'))['status'] == 'PASS'
          assert json.load(open('/tmp/maintenance-audit.json'))['configuration']['status'] == 'PASS'
          PY
          git diff --check

      - name: Commit target branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: register strategic policy intelligence capability pack'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Publish receipt
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'STRATEGIC_POLICY_PACK_REGISTRATION_PASS: registered 30 fixed offline modes, pinned package engines, systems route, cache inventory, and compatibility repairs on PR #45.'
