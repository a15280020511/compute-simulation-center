name: Validate Compute Network Isolation

on:
  pull_request:
    paths:
      - "compute-center/**"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/compute-network-isolation-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/**"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/compute-network-isolation-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-network-namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prove host network is available before isolation
        run: |
          python - <<'PY'
          import socket
          with socket.create_connection(("1.1.1.1", 443), timeout=5):
              print("host-network-available")
          PY

      - name: Prove external routes are unavailable inside compute namespace
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)"
          WORKSPACE="$GITHUB_WORKSPACE"
          sudo unshare --net --mount-proc bash -c "
            set -euo pipefail
            cd '$WORKSPACE'
            '$PYTHON_BIN' compute-center/network_assurance.py --output network-assurance.json
          "
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("network-assurance.json").read_text())
          assert report["status"] == "PASS", report
          assert report["external_route_available"] is False, report
          print(report)
          PY

      - name: Upload network evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compute-network-isolation-${{ github.run_id }}
          path: network-assurance.json
          if-no-files-found: error
          retention-days: 30
