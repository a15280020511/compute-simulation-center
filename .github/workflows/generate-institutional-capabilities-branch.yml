name: Generate Institutional Capabilities Branch

on:
  push:
    branches:
      - feat/exa-institutional-toolkit-expansion
    paths:
      - "compute-center/generate_effective_capabilities.py"

permissions:
  contents: write

concurrency:
  group: generate-institutional-capabilities-branch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/exa-institutional-toolkit-expansion
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate effective capability catalog
        run: python compute-center/generate_effective_capabilities.py
      - name: Commit deterministic generated catalog
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- compute-center/compute-capabilities.json; then
            echo "catalog already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compute-center/compute-capabilities.json
          git commit -m "chore: generate effective institutional capability catalog"
          git push origin HEAD:feat/exa-institutional-toolkit-expansion
