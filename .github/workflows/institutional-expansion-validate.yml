name: Validate Institutional Expansion

on:
  pull_request:
    paths:
      - "compute-center/institutional_expansion_operations.py"
      - "compute-center/institutional-expansion-mode-registry.json"
      - "compute-center/requirements-institutional-*.txt"
      - "compute-center/capability_manager.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/validate_institutional_expansion.py"
      - "compute-center/tests/test_institutional_expansion.py"
      - "compute-center/tests/test_decision_intelligence_gateway.py"
      - ".github/workflows/institutional-expansion-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/institutional_expansion_operations.py"
      - "compute-center/institutional-expansion-mode-registry.json"
      - "compute-center/requirements-institutional-*.txt"
      - "compute-center/capability_manager.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/validate_institutional_expansion.py"
      - "compute-center/tests/test_institutional_expansion.py"
      - "compute-center/tests/test_decision_intelligence_gateway.py"
      - ".github/workflows/institutional-expansion-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: institutional-expansion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install core and established decision dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt -r compute-center/requirements-finance.txt
      - name: Compile and validate governance
        working-directory: compute-center
        run: |
          python -m py_compile institutional_expansion_operations.py capability_manager.py decision_intelligence_gateway.py validate_institutional_expansion.py
          python capability_manager.py validate
          python -m unittest tests.test_institutional_expansion tests.test_decision_intelligence_gateway -v
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('institutional_expansion_operations.py').read_text(encoding='utf-8')
          for forbidden in ('import requests', 'import socket', 'urllib.request', 'subprocess.', 'pickle.loads', 'import mcp'):
              assert forbidden not in source, forbidden
          tree = ast.parse(source)
          calls = {node.func.id for node in ast.walk(tree) if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)}
          assert {'eval', 'exec', 'compile'}.isdisjoint(calls)
          PY

  validate-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: causal_pc_discovery, requirements: requirements-institutional-causal.txt}
          - {mode: causal_fci_discovery, requirements: requirements-institutional-causal.txt}
          - {mode: causal_graph_stability_bootstrap, requirements: requirements-institutional-causal.txt}
          - {mode: tigramite_pcmci_discovery, requirements: requirements-institutional-tigramite.txt}
          - {mode: evidently_data_drift, requirements: requirements-institutional-evidently.txt}
          - {mode: river_adwin_drift, requirements: requirements-institutional-river.txt}
          - {mode: skfolio_walk_forward_portfolio, requirements: requirements-institutional-skfolio.txt}
          - {mode: black_litterman_allocation, requirements: requirements-finance.txt}
          - {mode: deflated_sharpe_gate, requirements: ""}
          - {mode: transaction_cost_capacity, requirements: ""}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install isolated dependency pack
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          if [[ -n "$REQUIREMENTS" ]]; then
            python -m pip install --disable-pip-version-check --no-input --upgrade-strategy only-if-needed -r "compute-center/$REQUIREMENTS"
          fi
          python -m pip check
      - name: Execute fixed offline fixture
        working-directory: compute-center
        run: |
          mkdir -p institutional-expansion-artifacts
          python validate_institutional_expansion.py --mode "${{ matrix.mode }}" --output "institutional-expansion-artifacts/${{ matrix.mode }}.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          mode = os.environ['MODE']
          receipt = json.loads((Path('institutional-expansion-artifacts') / f'{mode}.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'PASS'
          assert receipt['mode'] == mode
          assert receipt['network_used'] is False
          assert receipt['model_calls'] == 0
          assert receipt['brokerage_execution'] is False
          assert receipt['arbitrary_code_used'] is False
          PY
        env:
          MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: institutional-expansion-${{ matrix.mode }}-${{ github.run_id }}
          path: compute-center/institutional-expansion-artifacts/
          if-no-files-found: warn
          retention-days: 30

  matrix-receipt:
    if: always()
    needs: [core-governance, validate-mode]
    runs-on: ubuntu-24.04
    steps:
      - name: Write deterministic receipt
        env:
          CORE: ${{ needs.core-governance.result }}
          MODES: ${{ needs.validate-mode.result }}
        run: |
          {
            echo "## Institutional Expansion Matrix"
            echo
            echo "- Core governance: ${CORE}"
            echo "- Ten-mode matrix: ${MODES}"
            echo "- Runtime network: denied / unused"
            echo "- Model calls: 0"
            echo "- Brokerage execution: false"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CORE" == "success" && "$MODES" == "success" ]]
