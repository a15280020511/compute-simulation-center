name: Validate Indirect Intelligence Fusion

on:
  pull_request:
    paths:
      - "compute-center/indirect_intelligence_operations.py"
      - "compute-center/indirect-intelligence-mode-registry.json"
      - "compute-center/capability_manager.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/strategic_policy_intelligence_operations.py"
      - "compute-center/bayesian_network_operations.py"
      - "compute-center/think_tank_global_operations.py"
      - "compute-center/requirements-*.txt"
      - "compute-center/tests/test_indirect_intelligence_analysis.py"
      - ".github/workflows/indirect-intelligence-validate.yml"
  push:
    branches:
      - main
      - feat/indirect-intelligence-analysis-20260808
    paths:
      - "compute-center/indirect_intelligence_operations.py"
      - "compute-center/indirect-intelligence-mode-registry.json"
      - "compute-center/capability_manager.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/strategic_policy_intelligence_operations.py"
      - "compute-center/bayesian_network_operations.py"
      - "compute-center/think_tank_global_operations.py"
      - "compute-center/requirements-*.txt"
      - "compute-center/tests/test_indirect_intelligence_analysis.py"
      - ".github/workflows/indirect-intelligence-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-indirect-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-intelligence-rapidfuzz.txt
            compute-center/requirements-intelligence-datasketch.txt
            compute-center/requirements-intelligence-splink.txt
            compute-center/requirements-graph-rdflib.txt
            compute-center/requirements-graph-owlready2.txt
            compute-center/requirements-graph-pyshacl.txt
            compute-center/requirements-graph-igraph.txt
            compute-center/requirements-global-pm4py.txt
            compute-center/requirements-bayesian-network.txt
            compute-center/requirements-intelligence-problog.txt

      - name: Resolve and install governed mode dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/indirect-ticket.json <<'JSON'
          {
            "operation": "finance_decision_analysis",
            "inputs": {"mode": "indirect_intelligence_analysis"}
          }
          JSON
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python compute-center/capability_manager.py requirements --ticket /tmp/indirect-ticket.json > /tmp/indirect-requirements.txt
          test "$(wc -l < /tmp/indirect-requirements.txt)" -eq 11
          while IFS= read -r requirement; do
            test -n "$requirement"
            python -m pip install --disable-pip-version-check --no-input -r "$requirement"
          done < /tmp/indirect-requirements.txt
          python -m pip check
          python compute-center/capability_manager.py plan --ticket /tmp/indirect-ticket.json > /tmp/indirect-runtime-plan.json

      - name: Execute full eight-stage offline fusion fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p indirect-intelligence-validation
          PYTHONPATH=compute-center python - <<'PY' | tee indirect-intelligence-validation/result.json
          import json
          from decision_intelligence_gateway import finance_decision_analysis

          inputs = {
              "mode": "indirect_intelligence_analysis",
              "analysis_depth": "deep",
              "hypothesis": "技术A已经进入跨机构实际司法应用",
              "prior_probability": 0.35,
              "scope": {
                  "time_window": "2025-2026",
                  "geographic_scope": "测试地区X/Y",
                  "institution_scope": "公开机构样本",
              },
              "assumptions": [
                  "公开资料可能存在选择性披露",
                  "条件证据在当前贝叶斯结构中按条件独立处理",
              ],
              "evidence": [
                  {
                      "evref": "ev-training",
                      "analysis_class": "DIRECT",
                      "stance": "support",
                      "reliability": 0.82,
                      "entity": "公安院校甲",
                      "institution": "公安院校甲",
                      "geography": "地区X",
                      "aliases": ["甲院", "公安甲院"],
                      "tokens": ["培训", "技术A", "课程", "司法"],
                      "p_if_true": 0.80,
                      "p_if_false": 0.30,
                      "case_id": "path-x",
                      "activity": "培训",
                      "timestamp": "2025-01-01",
                  },
                  {
                      "evref": "ev-standard",
                      "analysis_class": "DIRECT",
                      "stance": "support",
                      "reliability": 0.88,
                      "entity": "技术标准中心",
                      "institution": "技术标准中心",
                      "geography": "地区X",
                      "aliases": ["标准中心"],
                      "tokens": ["标准", "技术A", "规范", "司法"],
                      "p_if_true": 0.86,
                      "p_if_false": 0.25,
                      "case_id": "path-x",
                      "activity": "标准化",
                      "timestamp": "2025-03-01",
                  },
                  {
                      "evref": "ev-procurement",
                      "analysis_class": "DIRECT",
                      "stance": "support",
                      "reliability": 0.91,
                      "entity": "公安技术中心乙",
                      "institution": "公安技术中心乙",
                      "geography": "地区Y",
                      "aliases": ["乙技术中心", "技术中心乙"],
                      "tokens": ["采购", "技术A", "设备", "部署"],
                      "p_if_true": 0.90,
                      "p_if_false": 0.20,
                      "case_id": "path-y",
                      "activity": "采购",
                      "timestamp": "2025-06-01",
                  },
                  {
                      "evref": "ev-case",
                      "analysis_class": "LINKED",
                      "stance": "support",
                      "reliability": 0.84,
                      "entity": "法院丙",
                      "institution": "法院丙",
                      "geography": "地区Y",
                      "aliases": ["丙法院"],
                      "tokens": ["案件", "技术A", "证据", "评价"],
                      "p_if_true": 0.82,
                      "p_if_false": 0.35,
                      "case_id": "path-y",
                      "activity": "法院评价",
                      "timestamp": "2026-01-01",
                  },
                  {
                      "evref": "ev-counter",
                      "analysis_class": "DIRECT",
                      "stance": "contradict",
                      "reliability": 0.25,
                      "entity": "审计公开材料",
                      "institution": "审计公开材料",
                      "geography": "地区X",
                      "tokens": ["限制", "试点", "未普及", "技术A"],
                      "p_if_true": 0.30,
                      "p_if_false": 0.70,
                  },
              ],
              "entity_records": [
                  {"name": "公安技术中心乙", "institution": "公安技术中心乙", "geography": "地区Y"},
                  {"name": "乙技术中心", "institution": "公安技术中心乙", "geography": "地区Y"},
                  {"name": "法院丙", "institution": "法院丙", "geography": "地区Y"},
              ],
              "entity_fields": ["name", "institution", "geography"],
              "entity_match_threshold": 0.80,
              "relations": [
                  {"subject": "公安院校甲", "predicate": "培训", "object": "技术A"},
                  {"subject": "技术标准中心", "predicate": "规范", "object": "技术A"},
                  {"subject": "公安技术中心乙", "predicate": "部署", "object": "技术A"},
                  {"subject": "技术A", "predicate": "用于", "object": "案件实践"},
                  {"subject": "案件实践", "predicate": "审查", "object": "检察技术审查"},
                  {"subject": "检察技术审查", "predicate": "进入", "object": "法院丙"},
              ],
              "path_targets": ["公安技术中心乙", "技术A", "案件实践", "法院丙"],
              "process_cases": [
                  {"case_id": "lifecycle-x", "activities": ["研究", "培训", "标准化", "采购", "部署"]},
                  {"case_id": "lifecycle-y", "activities": ["培训", "采购", "部署", "案件实践", "检察审查", "法院评价"]},
              ],
              "rules": [
                  {
                      "name": "deployment-signal",
                      "required_evrefs": ["ev-training", "ev-standard", "ev-procurement"],
                  },
                  {
                      "name": "practice-signal",
                      "required_evrefs": ["ev-procurement", "ev-case"],
                  },
              ],
          }
          result = finance_decision_analysis(inputs)
          expected_stages = [
              "name_normalization",
              "similarity_collision",
              "entity_resolution",
              "knowledge_graph",
              "graph_analysis",
              "process_mining",
              "probabilistic_inference",
              "contradiction_check",
          ]
          assert result["mode"] == "indirect_intelligence_analysis", result
          assert result["runtime_registration"] == "controlled-preview-overlay", result
          assert result["stage_plan"]["selected_stages"] == expected_stages, result["stage_plan"]
          assert result["stage_plan"]["solver_status"] == "OPTIMAL", result["stage_plan"]
          assert result["stage_plan"]["serial_execution"] is True, result["stage_plan"]
          assert result["network_used"] is False, result
          assert result["external_data_fetches"] == 0, result
          assert result["model_calls"] == 0, result
          assert result["automatic_parallel_execution"] is False, result
          assert result["scope_extrapolation_allowed"] is False, result
          assert result["analysis_class"] in {"INFERRED", "CONTRADICTED"}, result
          assert result["inference_not_fact"] is True, result
          assert result["posterior_probability"] is not None, result
          assert result["stage_results"]["entity_resolution"]["matched_pairs"], result
          assert result["stage_results"]["process_mining"]["directly_follows_edges"], result
          assert len(result["stage_results"]["probabilistic_inference"]["problog_rules"]) == 2, result
          assert result["stage_results"]["contradiction_check"], result
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

      - name: Verify runtime plan remains offline and bounded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/indirect-runtime-plan.json').read_text(encoding='utf-8'))
          result = json.loads(Path('indirect-intelligence-validation/result.json').read_text(encoding='utf-8').splitlines()[-1])
          assert plan['capability_pack'] == 'decision-intelligence', plan
          assert plan['mode'] == 'indirect_intelligence_analysis', plan
          assert plan['network_policy'] == 'deny', plan
          assert plan['maturity'] == 'controlled-preview', plan
          assert plan['arbitrary_code_allowed'] is False, plan
          assert plan['arbitrary_requirements_allowed'] is False, plan
          assert len(plan['requirements']) == 11, plan
          assert result['decision_support_only'] is True, result
          assert result['expert_semantic_synthesis_required_for_publication'] is True, result
          assert result['governance_release_gate_required'] is True, result
          print(json.dumps({
              'status': 'PASS',
              'mode': plan['mode'],
              'dependency_packs': len(plan['requirements']),
              'selected_stages': result['stage_plan']['selected_stages'],
              'posterior_probability': result['posterior_probability'],
              'analysis_class': result['analysis_class'],
              'network_used': result['network_used'],
              'model_calls': result['model_calls'],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload indirect intelligence validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indirect-intelligence-${{ github.run_id }}
          path: indirect-intelligence-validation/
          if-no-files-found: error
          retention-days: 30
