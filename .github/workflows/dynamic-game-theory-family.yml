name: Validate Dynamic Game Theory Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_game_theory_planner.py"
      - "compute-center/dynamic_game_theory_adapters.py"
      - "compute-center/dynamic-game-theory-policy.json"
      - "compute-center/dynamic-game-theory-capability-graph.json"
      - "compute-center/dynamic-game-theory-stage-contracts.json"
      - "compute-center/strategic_policy_intelligence_operations.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/tool_registry.py"
      - "compute-center/compute_dispatch.py"
      - "compute-center/validate_dynamic_game_theory.py"
      - "compute-center/tests/test_dynamic_game_theory_family.py"
      - "compute-center/tests/test_dynamic_family_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-game-theory-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-game-theory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-strategy-open-spiel.txt
            compute-center/requirements-strategy-pygambit.txt
      - name: Install core and isolated game-analysis dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt \
            -r compute-center/requirements-strategy-open-spiel.txt \
            -r compute-center/requirements-strategy-pygambit.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          assert version("open-spiel") == "2.0.1"
          assert version("pygambit") == "16.7.0"
          PY
      - name: Compile game-theory dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_game_theory_adapters.py \
            dynamic_game_theory_planner.py \
            strategic_policy_intelligence_operations.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            tool_registry.py \
            validate_dynamic_game_theory.py \
            tests/test_dynamic_game_theory_family.py \
            tests/test_dynamic_family_router_coexistence.py
      - name: Run game-theory and existing dynamic-family regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_dynamic_game_theory_family \
            tests.test_dynamic_family_router_coexistence \
            tests.test_dynamic_system_dynamics_family \
            tests.test_dynamic_optimization_family \
            tests.test_dynamic_reliability_family \
            tests.test_dynamic_state_estimation_family \
            tests.test_dynamic_bayesian_network_family \
            tests.test_dynamic_time_series_family \
            tests.test_dynamic_pipeline_planner \
            tests.test_dynamic_runtime_integration \
            tests.test_dynamic_generic_extensions -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for game-theory family
        working-directory: compute-center
        run: python validate_dynamic_game_theory.py
