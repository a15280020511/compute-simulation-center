name: Validate Dynamic Indirect Intelligence Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_indirect_intelligence_planner.py"
      - "compute-center/dynamic-indirect-intelligence-capability-graph.json"
      - "compute-center/indirect_intelligence_operations.py"
      - "compute-center/indirect-intelligence-mode-registry.json"
      - "compute-center/tool_registry.py"
      - "compute-center/tests/test_dynamic_indirect_intelligence_family.py"
      - "compute-center/tests/run_dynamic_indirect_intelligence_real_fixture.py"
      - ".github/workflows/dynamic-indirect-intelligence-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_indirect_intelligence_planner.py"
      - "compute-center/dynamic-indirect-intelligence-capability-graph.json"
      - "compute-center/indirect_intelligence_operations.py"
      - "compute-center/indirect-intelligence-mode-registry.json"
      - "compute-center/tool_registry.py"
      - "compute-center/tests/test_dynamic_indirect_intelligence_family.py"
      - "compute-center/tests/run_dynamic_indirect_intelligence_real_fixture.py"
      - ".github/workflows/dynamic-indirect-intelligence-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-dynamic-indirect-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-dynamic-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-intelligence-rapidfuzz.txt
            compute-center/requirements-intelligence-datasketch.txt
            compute-center/requirements-intelligence-splink.txt
            compute-center/requirements-graph-rdflib.txt
            compute-center/requirements-graph-owlready2.txt
            compute-center/requirements-graph-pyshacl.txt
            compute-center/requirements-graph-igraph.txt
            compute-center/requirements-global-pm4py.txt
            compute-center/requirements-bayesian-network.txt
            compute-center/requirements-intelligence-problog.txt

      - name: Resolve mode-aware dynamic runtime and install allowlist
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dynamic-indirect-ticket.json <<'JSON'
          {
            "task_id": "dynamic-indirect-ci",
            "operation": "finance_decision_analysis",
            "inputs": {
              "mode": "indirect_intelligence_analysis",
              "hypothesis": "技术A已经进入实际司法应用",
              "evidence": [{"evref":"bootstrap","analysis_class":"DIRECT","stance":"support","reliability":0.8}]
            },
            "pipeline": {
              "pipeline_id": "dynamic-auto-v1",
              "stage_id": "dynamic",
              "sequence_reason": "real indirect intelligence dynamic family validation",
              "upstream_refs": []
            }
          }
          JSON
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python compute-center/tool_registry.py requirements --ticket /tmp/dynamic-indirect-ticket.json > /tmp/dynamic-indirect-requirements.txt
          test "$(wc -l < /tmp/dynamic-indirect-requirements.txt)" -eq 11
          while IFS= read -r requirement; do
            test -n "$requirement"
            python -m pip install --disable-pip-version-check --no-input -r "$requirement"
          done < /tmp/dynamic-indirect-requirements.txt
          python -m pip check
          python compute-center/tool_registry.py plan --ticket /tmp/dynamic-indirect-ticket.json > /tmp/dynamic-indirect-plan.json

      - name: Execute real unified dynamic family and all eight fusion stages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dynamic-indirect-validation
          PYTHONPATH=compute-center python compute-center/tests/run_dynamic_indirect_intelligence_real_fixture.py

      - name: Upload real dynamic family evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dynamic-indirect-intelligence-${{ github.run_id }}
          path: dynamic-indirect-validation/
          if-no-files-found: error
          retention-days: 30
