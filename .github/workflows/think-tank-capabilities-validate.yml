name: Validate Top Think-Tank Capabilities

on:
  pull_request:
    paths:
      - "compute-center/**"
      - ".github/workflows/think-tank-capabilities-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/**"
      - ".github/workflows/think-tank-capabilities-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: think-tank-capabilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-thinktank-data.txt
            compute-center/requirements-thinktank-econometrics.txt
            compute-center/requirements-thinktank-finance.txt
            compute-center/requirements-thinktank-decision.txt
            compute-center/requirements-thinktank-bayesian.txt
            compute-center/requirements-thinktank-geospatial.txt
      - run: python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
      - run: python -m py_compile compute-center/*.py compute-center/tests/*.py
      - run: python compute-center/think_tank_registry_validate.py
      - run: python -m unittest compute-center/tests/test_think_tank_operations.py -v
      - run: python compute-center/capability_manager.py validate
      - run: python compute-center/tool_registry.py validate
      - run: python compute-center/governance_catalog.py

  pack-validation:
    needs: registry-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pack: data
            requirements: requirements-thinktank-data.txt
          - pack: econometrics
            requirements: requirements-thinktank-econometrics.txt
          - pack: finance
            requirements: requirements-thinktank-finance.txt
          - pack: decision
            requirements: requirements-thinktank-decision.txt
          - pack: bayesian
            requirements: requirements-thinktank-bayesian.txt
          - pack: geospatial
            requirements: requirements-thinktank-geospatial.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/${{ matrix.requirements }}
      - name: Install isolated capability pack
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip install --disable-pip-version-check --no-input -r compute-center/${{ matrix.requirements }}
          python -m pip check
      - name: Validate all modes in pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p think-tank-validation
          python compute-center/validate_think_tank_packs.py --pack "${{ matrix.pack }}" \
            | tee "think-tank-validation/${{ matrix.pack }}.json"
      - name: Validate GEKKO local backend
        if: matrix.pack == 'decision'
        run: python -m unittest compute-center/tests/test_gekko_backend.py -v
      - name: Prove offline runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pack = "${{ matrix.pack }}"
          result = json.loads(Path(f"think-tank-validation/{pack}.json").read_text(encoding="utf-8"))
          assert result["status"] == "PASS"
          assert result["network_used"] is False
          assert result["model_calls"] == 0
          assert result["mode_count"] > 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: think-tank-${{ matrix.pack }}-${{ github.run_id }}
          path: think-tank-validation/
          if-no-files-found: warn
          retention-days: 30
