name: Validate Uncertainty Factor Accuracy Pack

on:
  pull_request:
    paths:
      - "compute-center/uncertainty_factor_accuracy_operations.py"
      - "compute-center/validate_uncertainty_factor_accuracy.py"
      - "compute-center/distribution-registry.json"
      - "compute-center/variable-role-registry.json"
      - "compute-center/assumption-register.schema.json"
      - "compute-center/assumption_runtime.py"
      - "compute-center/accuracy-enhancement-capabilities.json"
      - "compute-center/institutional-expansion-mode-registry.json"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/tests/test_uncertainty_factor_accuracy.py"
      - "compute-center/tests/test_assumption_distribution_completion.py"
      - "compute-center/tests/test_institutional_expansion.py"
      - "compute-center/tests/test_decision_intelligence_gateway.py"
      - ".github/workflows/uncertainty-factor-accuracy-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/uncertainty_factor_accuracy_operations.py"
      - "compute-center/validate_uncertainty_factor_accuracy.py"
      - "compute-center/distribution-registry.json"
      - "compute-center/variable-role-registry.json"
      - "compute-center/assumption-register.schema.json"
      - "compute-center/assumption_runtime.py"
      - "compute-center/accuracy-enhancement-capabilities.json"
      - "compute-center/institutional-expansion-mode-registry.json"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/tests/test_uncertainty_factor_accuracy.py"
      - "compute-center/tests/test_assumption_distribution_completion.py"
      - "compute-center/tests/test_institutional_expansion.py"
      - "compute-center/tests/test_decision_intelligence_gateway.py"
      - ".github/workflows/uncertainty-factor-accuracy-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uncertainty-factor-accuracy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements.txt
      - name: Install pinned core dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
      - name: Compile and validate governance
        working-directory: compute-center
        run: |
          python -m py_compile uncertainty_factor_accuracy_operations.py validate_uncertainty_factor_accuracy.py decision_intelligence_gateway.py assumption_runtime.py
          python capability_manager.py validate
          python tool_registry.py validate
          python -m unittest tests.test_uncertainty_factor_accuracy tests.test_assumption_distribution_completion tests.test_institutional_expansion -v
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          for path in (
              'distribution-registry.json',
              'variable-role-registry.json',
              'assumption-register.schema.json',
              'accuracy-enhancement-capabilities.json',
              'institutional-expansion-mode-registry.json',
          ):
              json.loads(Path(path).read_text(encoding='utf-8'))
          source = Path('uncertainty_factor_accuracy_operations.py').read_text(encoding='utf-8')
          for forbidden in (
              'import requests', 'import socket', 'urllib.request', 'subprocess.',
              'pickle.loads', 'import mcp', 'OPENROUTER_API_KEY', 'eval(', 'exec(',
          ):
              assert forbidden not in source, forbidden
          tree = ast.parse(source)
          calls = {
              node.func.id
              for node in ast.walk(tree)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
          }
          assert {'eval', 'exec', 'compile'}.isdisjoint(calls)
          PY

  validate-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode:
          - joint_random_sample
          - distribution_fit_select
          - variable_role_validate
          - probabilistic_accuracy
          - forecast_accuracy
          - bayesian_linear_calibration
          - reliability_analysis
          - factor_information_analysis
          - factor_selection_diagnostics
          - factor_overfit_diagnostics
          - cross_validation_plan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements.txt
      - name: Install pinned core dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
      - name: Execute fixed offline fixture
        working-directory: compute-center
        env:
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p uncertainty-factor-accuracy-artifacts
          python validate_uncertainty_factor_accuracy.py --mode "$MODE" --output "uncertainty-factor-accuracy-artifacts/${MODE}.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ['MODE']
          receipt = json.loads((Path('uncertainty-factor-accuracy-artifacts') / f'{mode}.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'PASS'
          assert receipt['mode'] == mode
          assert receipt['network_used'] is False
          assert receipt['model_calls'] == 0
          assert receipt['brokerage_execution'] is False
          assert receipt['arbitrary_code_used'] is False
          assert receipt['deterministic_fixture'] is True
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uncertainty-factor-accuracy-${{ matrix.mode }}-${{ github.run_id }}
          path: compute-center/uncertainty-factor-accuracy-artifacts/
          if-no-files-found: warn
          retention-days: 30

  matrix-receipt:
    if: always()
    needs: [core-governance, validate-mode]
    runs-on: ubuntu-24.04
    steps:
      - name: Write deterministic receipt
        env:
          CORE: ${{ needs.core-governance.result }}
          MODES: ${{ needs.validate-mode.result }}
        run: |
          {
            echo "## Uncertainty, Factor and Accuracy Completion Matrix"
            echo
            echo "- Core governance: ${CORE}"
            echo "- Eleven-mode matrix: ${MODES}"
            echo "- Runtime network: denied / unused"
            echo "- Model calls: 0"
            echo "- Brokerage execution: false"
            echo "- Ticket-supplied code: false"
            echo "- Maturity: controlled-preview"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CORE" == "success" && "$MODES" == "success" ]]
