name: Patch Strategic Fixture Boundary

on:
  pull_request:
    paths:
      - "compute-center/patch_strategic_fixture_boundary.py"
      - ".github/workflows/patch-strategic-fixture-boundary.yml"

permissions:
  contents: write

concurrency:
  group: patch-strategic-fixture-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply deterministic fixture-boundary patch
        run: python compute-center/patch_strategic_fixture_boundary.py

      - name: Validate combined fixture coverage
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m py_compile \
            compute-center/validate_strategic_policy_pack.py \
            compute-center/validate_behavior_finance_intelligence_pack.py \
            compute-center/patch_strategic_fixture_boundary.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'compute-center')
          import strategic_policy_intelligence_operations as runtime
          import validate_strategic_policy_pack as strategic
          import validate_behavior_finance_intelligence_pack as behavior
          s = set(strategic.FIXTURES)
          b = set(behavior.FIXTURES)
          r = set(runtime.HANDLERS)
          assert len(s) == 30
          assert len(b) == 12
          assert len(r) == 42
          assert not (s & b)
          assert s | b == r
          PY
          python compute-center/validate_strategic_policy_pack.py \
            --mode issue_tree_coverage \
            --output /tmp/strategic-fixture.json
          python compute-center/validate_behavior_finance_intelligence_pack.py \
            --mode group_consensus_pressure \
            --output /tmp/behavior-fixture.json
          git diff --check

      - name: Commit fixture boundary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compute-center/validate_strategic_policy_pack.py
          if git diff --cached --quiet; then
            echo "fixture boundary already synchronized"
            exit 0
          fi
          git commit -m "fix: separate strategic and behavior fixture coverage"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
