name: Validate Dynamic System Dynamics Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_system_dynamics_planner.py"
      - "compute-center/dynamic_system_dynamics_adapters.py"
      - "compute-center/dynamic-system-dynamics-policy.json"
      - "compute-center/dynamic-system-dynamics-capability-graph.json"
      - "compute-center/dynamic-system-dynamics-stage-contracts.json"
      - "compute-center/institutional_operations.py"
      - "compute-center/compute_runner.py"
      - "compute-center/assurance_operations.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/tool_registry.py"
      - "compute-center/compute_dispatch.py"
      - "compute-center/validate_dynamic_system_dynamics.py"
      - "compute-center/tests/test_dynamic_system_dynamics_family.py"
      - "compute-center/tests/test_dynamic_family_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-system-dynamics-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-system-dynamics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
      - name: Install core and selector dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          PY
      - name: Compile system-dynamics dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_system_dynamics_adapters.py \
            dynamic_system_dynamics_planner.py \
            institutional_operations.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            tool_registry.py \
            validate_dynamic_system_dynamics.py \
            tests/test_dynamic_system_dynamics_family.py \
            tests/test_dynamic_family_router_coexistence.py
      - name: Run system-dynamics and existing dynamic-family regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_dynamic_system_dynamics_family \
            tests.test_dynamic_family_router_coexistence \
            tests.test_dynamic_optimization_family \
            tests.test_dynamic_reliability_family \
            tests.test_dynamic_state_estimation_family \
            tests.test_dynamic_bayesian_network_family \
            tests.test_dynamic_time_series_family \
            tests.test_dynamic_pipeline_planner \
            tests.test_dynamic_runtime_integration \
            tests.test_dynamic_generic_extensions -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for system-dynamics family
        working-directory: compute-center
        run: python validate_dynamic_system_dynamics.py
