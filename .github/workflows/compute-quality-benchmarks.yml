name: Validate Institutional Compute Quality

on:
  pull_request:
    paths:
      - "compute-center/**"
      - ".github/workflows/compute-quality-benchmarks.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/**"
      - ".github/workflows/compute-quality-benchmarks.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: institutional-compute-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-quality-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-finance.txt
            compute-center/requirements-mesa.txt

      - name: Install isolated benchmark environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements-mesa.txt
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements-finance.txt
          python -m pip check

      - name: Compile quality and benchmark runtime
        run: |
          set -euo pipefail
          python -m py_compile \
            compute-center/quality_gate.py \
            compute-center/compute_dispatch.py \
            compute-center/benchmarks/validate_golden.py \
            compute-center/benchmarks/validate_frozen_real.py \
            compute-center/tests/test_quality_gate.py

      - name: Validate strict policy contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('compute-center/data-readiness-policy.json').read_text())
          assert policy['schema_version'] == 'data-readiness-policy-v2'
          assert policy['default_policy']['enforcement'] == 'strict'
          assert policy['default_policy']['max_assumption_ratio'] == 0.25
          assert policy['decision_profiles']['high_stakes']['max_assumption_ratio'] == 0.1
          assert 'probability_calibration' in policy['numeric_checks']
          assert 'distribution_drift' in policy['numeric_checks']
          print(json.dumps({'status': 'PASS', 'default_enforcement': 'strict'}))
          PY

      - name: Run calibration and release-gate tests
        run: |
          set -o pipefail
          python -m unittest discover -s compute-center/tests -p 'test_quality_gate.py' -v \
            2>&1 | tee quality-gate-tests.log

      - name: Run numerical golden oracle suite
        run: |
          set -o pipefail
          mkdir -p institutional-quality-artifacts
          python compute-center/benchmarks/validate_golden.py \
            institutional-quality-artifacts/golden-benchmark-result.json \
            2>&1 | tee institutional-quality-artifacts/golden-console.log

      - name: Run frozen real-world suite
        run: |
          set -o pipefail
          python compute-center/benchmarks/validate_frozen_real.py \
            institutional-quality-artifacts/frozen-real-benchmark-result.json \
            2>&1 | tee institutional-quality-artifacts/frozen-real-console.log

      - name: Verify institutional acceptance evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('institutional-quality-artifacts')
          golden = json.loads((root / 'golden-benchmark-result.json').read_text())
          frozen = json.loads((root / 'frozen-real-benchmark-result.json').read_text())
          assert golden['status'] == 'PASS' and golden['passed'] == 10 and golden['failed'] == 0
          assert frozen['status'] == 'PASS' and len(frozen['datasets']) == 5
          print(json.dumps({
              'status': 'PASS',
              'golden_cases': golden['passed'],
              'frozen_real_datasets': len(frozen['datasets']),
              'default_formal_gate': 'strict',
              'calibration_metrics': ['Brier', 'ECE', 'log_loss', 'interval_coverage'],
              'drift_metrics': ['PSI', 'KS', 'standardized_mean_shift'],
          }))
          PY

      - name: Upload institutional quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: institutional-compute-quality-${{ github.run_id }}
          path: |
            institutional-quality-artifacts/
            quality-gate-tests.log
            compute-center/data-readiness-policy.json
            compute-center/benchmarks/golden/manifest.json
            compute-center/benchmarks/frozen-real/manifest.json
          if-no-files-found: error
          retention-days: 30
