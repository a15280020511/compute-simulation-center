name: One-shot Global Think Tank Toolkit Compatibility

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-global-toolkit-compatibility
  cancel-in-progress: false

jobs:
  compatibility:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-global-toolkit-compatibility]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: openturns
            spec: openturns==1.27.post1
          - candidate: control
            spec: control==0.10.2
          - candidate: pm4py
            spec: pm4py==2.7.23.3
          - candidate: smt
            spec: smt==2.14.1
          - candidate: econml
            spec: econml==0.16.0
          - candidate: spreg
            spec: spreg==1.9.0
          - candidate: arch
            spec: arch==8.0.0
          - candidate: mapie
            spec: MAPIE==1.4.1
          - candidate: pydoe3
            spec: pyDOE3==1.6.2
          - candidate: lmfit
            spec: lmfit==1.3.4
          - candidate: skgstat
            spec: scikit-gstat==1.0.23
          - candidate: aequilibrae
            spec: aequilibrae==1.6.2
          - candidate: pysd
            spec: pysd==3.14.3
          - candidate: causalpy
            spec: CausalPy==0.8.1
          - candidate: rsome
            spec: rsome==1.3.1
          - candidate: epydemix
            spec: epydemix==1.3.1
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      CANDIDATE: ${{ matrix.candidate }}
      SPEC: ${{ matrix.spec }}
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install candidate and run numerical smoke test
        shell: bash
        run: |
          set +e
          mkdir -p compatibility-artifacts
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt "$SPEC" \
            > compatibility-artifacts/install.log 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            python -m pip check >> compatibility-artifacts/install.log 2>&1
            install_status=$?
          fi
          if [ "$install_status" -eq 0 ]; then
            python - <<'PY' > compatibility-artifacts/smoke.log 2>&1
          import json
          import math
          import os
          import tempfile
          from pathlib import Path

          import numpy as np

          candidate = os.environ["CANDIDATE"]
          detail = {}

          if candidate == "openturns":
              import openturns as ot
              value = float(ot.Normal(0.0, 1.0).computeCDF(0.0))
              assert abs(value - 0.5) < 1e-12
              detail = {"cdf_zero": value, "version": ot.__version__}
          elif candidate == "control":
              import control
              system = control.tf([1.0], [1.0, 1.0])
              time, response = control.step_response(system, T=np.linspace(0.0, 8.0, 81))
              assert len(time) == 81 and 0.99 < float(response[-1]) < 1.01
              detail = {"final_response": float(response[-1]), "version": control.__version__}
          elif candidate == "pm4py":
              import pandas as pd
              import pm4py
              frame = pd.DataFrame({
                  "case:concept:name": ["a", "a", "a", "b", "b"],
                  "concept:name": ["start", "review", "done", "start", "done"],
                  "time:timestamp": pd.to_datetime([
                      "2026-01-01T00:00:00Z", "2026-01-01T00:01:00Z", "2026-01-01T00:02:00Z",
                      "2026-01-02T00:00:00Z", "2026-01-02T00:01:00Z",
                  ]),
              })
              frame = pm4py.format_dataframe(frame, case_id="case:concept:name", activity_key="concept:name", timestamp_key="time:timestamp")
              dfg, starts, ends = pm4py.discover_dfg(frame)
              assert dfg and starts and ends
              detail = {"edges": len(dfg), "version": pm4py.__version__}
          elif candidate == "smt":
              from importlib.metadata import version
              from smt.surrogate_models import RBF
              x = np.linspace(0.0, 1.0, 8).reshape(-1, 1)
              y = np.sin(x * np.pi)
              model = RBF(d0=0.2, print_global=False)
              model.set_training_values(x, y)
              model.train()
              pred = model.predict_values(np.array([[0.5]]))
              assert pred.shape == (1, 1) and np.isfinite(pred).all()
              detail = {"prediction": float(pred[0, 0]), "version": version("smt")}
          elif candidate == "econml":
              from importlib.metadata import version
              from econml.dml import LinearDML
              from sklearn.linear_model import LinearRegression
              rng = np.random.default_rng(7)
              x = rng.normal(size=(80, 2))
              t = 0.4 * x[:, 0] + rng.normal(scale=0.3, size=80)
              y = 2.0 * t + 0.5 * x[:, 1] + rng.normal(scale=0.1, size=80)
              model = LinearDML(model_y=LinearRegression(), model_t=LinearRegression(), cv=3, random_state=7)
              model.fit(y, t, X=x)
              effect = np.asarray(model.effect(x[:5]), dtype=float)
              assert effect.shape == (5,) and np.isfinite(effect).all()
              detail = {"mean_effect": float(effect.mean()), "version": version("econml")}
          elif candidate == "spreg":
              from importlib.metadata import version
              from libpysal.weights import W
              from spreg import ML_Lag
              n = 30
              neighbors = {i: [(i - 1) % n, (i + 1) % n] for i in range(n)}
              weights = {i: [1.0, 1.0] for i in range(n)}
              w = W(neighbors, weights, silence_warnings=True)
              w.transform = "r"
              x = np.linspace(-1.0, 1.0, n).reshape(-1, 1)
              y = (1.0 + 2.0 * x[:, 0] + 0.05 * np.sin(np.arange(n))).reshape(-1, 1)
              model = ML_Lag(y, x, w=w, method="ord")
              assert np.isfinite(model.betas).all() and math.isfinite(float(model.rho))
              detail = {"rho": float(model.rho), "version": version("spreg")}
          elif candidate == "arch":
              from importlib.metadata import version
              from arch import arch_model
              rng = np.random.default_rng(11)
              returns = rng.normal(scale=1.0, size=250)
              fitted = arch_model(returns, mean="Constant", vol="GARCH", p=1, q=1, dist="normal", rescale=False).fit(disp="off", show_warning=False)
              variance = np.asarray(fitted.forecast(horizon=3, reindex=False).variance.values[-1], dtype=float)
              assert variance.shape == (3,) and np.all(variance > 0)
              detail = {"variance": variance.tolist(), "version": version("arch")}
          elif candidate == "mapie":
              from importlib.metadata import version
              from mapie.regression import CrossConformalRegressor
              from sklearn.linear_model import LinearRegression
              x = np.linspace(-2.0, 2.0, 60).reshape(-1, 1)
              y = 3.0 * x[:, 0] + 0.2 * np.sin(np.arange(60))
              model = CrossConformalRegressor(estimator=LinearRegression(), confidence_level=0.9, cv=3, random_state=5)
              model.fit_conformalize(x, y)
              point, interval = model.predict_interval(np.array([[0.0], [1.0]]))
              assert point.shape == (2,) and interval.shape == (2, 2, 1) and np.isfinite(interval).all()
              detail = {"width": float(np.mean(interval[:, 1, 0] - interval[:, 0, 0])), "version": version("mapie")}
          elif candidate == "pydoe3":
              from importlib.metadata import version
              from pyDOE3 import lhs
              design = lhs(4, samples=16, criterion="maximin", random_state=7)
              assert design.shape == (16, 4) and np.all((design >= 0) & (design <= 1))
              detail = {"shape": list(design.shape), "version": version("pyDOE3")}
          elif candidate == "lmfit":
              import lmfit
              x = np.linspace(0.0, 5.0, 50)
              y = 1.5 * np.exp(-0.7 * x) + 0.2
              model = lmfit.Model(lambda x, amplitude, decay, offset: amplitude * np.exp(-decay * x) + offset)
              result = model.fit(y, x=x, amplitude=1.0, decay=0.5, offset=0.0)
              assert result.success and abs(result.params["decay"].value - 0.7) < 1e-3
              detail = {"decay": float(result.params["decay"].value), "version": lmfit.__version__}
          elif candidate == "skgstat":
              from importlib.metadata import version
              from skgstat import Variogram
              coordinates = np.array([[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1]], dtype=float)
              values = np.array([1.0, 1.2, 1.1, 1.5, 2.0, 2.2])
              variogram = Variogram(coordinates, values, model="spherical", n_lags=3, normalize=False)
              params = np.asarray(variogram.parameters, dtype=float)
              assert params.size >= 2 and np.isfinite(params).all()
              detail = {"parameters": params.tolist(), "version": version("scikit-gstat")}
          elif candidate == "aequilibrae":
              from importlib.metadata import version
              import aequilibrae
              assert aequilibrae is not None
              detail = {"import": True, "version": version("aequilibrae")}
          elif candidate == "pysd":
              import pysd
              assert hasattr(pysd, "read_vensim") and hasattr(pysd, "read_xmile")
              detail = {"import": True, "version": pysd.__version__}
          elif candidate == "causalpy":
              from importlib.metadata import version
              import causalpy
              assert causalpy is not None
              detail = {"import": True, "version": version("CausalPy")}
          elif candidate == "rsome":
              from importlib.metadata import version
              from rsome import ro
              from rsome import lpg_solver as solver
              model = ro.Model()
              x = model.dvar(2)
              model.min(3 * x[0] + 2 * x[1])
              model.st(x[0] + x[1] >= 1, x >= 0)
              model.solve(solver, display=False)
              solution = np.asarray(x.get(), dtype=float)
              assert solution.shape == (2,) and np.isfinite(solution).all()
              detail = {"solution": solution.tolist(), "version": version("rsome")}
          elif candidate == "epydemix":
              from importlib.metadata import version
              from epydemix import EpiModel
              assert EpiModel is not None
              detail = {"import": True, "version": version("epydemix")}
          else:
              raise AssertionError(f"unknown candidate: {candidate}")

          Path("compatibility-artifacts/result.json").write_text(
              json.dumps({"candidate": candidate, "status": "PASS", "detail": detail}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
            smoke_status=$?
          else
            smoke_status=1
          fi
          if [ "$install_status" -ne 0 ] || [ "$smoke_status" -ne 0 ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          logs = ""
          for name in ("install.log", "smoke.log"):
              path = Path("compatibility-artifacts") / name
              if path.exists():
                  logs += path.read_text(encoding="utf-8", errors="replace") + "\n"
          Path("compatibility-artifacts/result.json").write_text(
              json.dumps({
                  "candidate": os.environ["CANDIDATE"],
                  "status": "FAIL",
                  "error_tail": logs[-1800:],
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
          fi
          exit 0

      - name: Publish compatibility result
        if: always()
        shell: bash
        run: |
          python - <<'PY' > compatibility-comment.md
          import json
          from pathlib import Path
          path = Path("compatibility-artifacts/result.json")
          if not path.exists():
              data = {"candidate": "unknown", "status": "FAIL", "error_tail": "result document missing"}
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
          print(f"Global toolkit compatibility: `{data['candidate']}` / `{data['status']}`")
          print()
          if data["status"] == "PASS":
              print(f"- Detail: `{json.dumps(data.get('detail', {}), ensure_ascii=False)[:900]}`")
          else:
              safe = str(data.get("error_tail", "unknown failure")).replace("`", "'").replace("\n", " ")[-1200:]
              print(f"- Failure tail: `{safe}`")
          print("- Python: `3.12`")
          print("- Baseline: `compute-center/requirements.txt`")
          print("- Network during compute production: `deny` (compatibility installation only uses PyPI)")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@compatibility-comment.md

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-toolkit-${{ matrix.candidate }}-${{ github.run_id }}
          path: compatibility-artifacts/
          if-no-files-found: warn
          retention-days: 30
