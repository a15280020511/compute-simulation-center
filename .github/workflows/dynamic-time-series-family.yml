name: Validate Dynamic Time-Series Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_time_series_planner.py"
      - "compute-center/dynamic-time-series-policy.json"
      - "compute-center/dynamic-time-series-capability-graph.json"
      - "compute-center/pipeline_adapters.py"
      - "compute-center/operation-contract-registry.json"
      - "compute-center/compute_dispatch.py"
      - "compute-center/tool_registry.py"
      - "compute-center/validate_dynamic_time_series.py"
      - "compute-center/tests/test_dynamic_time_series_family.py"
      - ".github/workflows/dynamic-time-series-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-time-series-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
      - name: Install core and dynamic optimization dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt
          python -m pip check
      - name: Compile family router and planners
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_time_series_planner.py \
            dynamic_pipeline_planner.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            tool_registry.py \
            validate_dynamic_time_series.py
      - name: Run time-series and scenario-family regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_dynamic_time_series_family \
            tests.test_dynamic_pipeline_planner \
            tests.test_dynamic_runtime_integration \
            tests.test_dynamic_generic_extensions -v
      - name: Verify production dispatcher route for time-series family
        working-directory: compute-center
        run: python validate_dynamic_time_series.py
