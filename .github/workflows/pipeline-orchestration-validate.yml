name: Validate NetworkX Pipeline Orchestration

on:
  pull_request:
    paths:
      - "compute-center/pipeline-registry.json"
      - "compute-center/operation-contract-registry.json"
      - "compute-center/pipeline_adapters.py"
      - "compute-center/pipeline_engine.py"
      - "compute-center/compute_dispatch.py"
      - "compute-center/requirements.txt"
      - "compute-center/requirements-mesa.txt"
      - "compute-center/tests/test_pipeline_engine.py"
      - ".github/workflows/pipeline-orchestration-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/pipeline-registry.json"
      - "compute-center/operation-contract-registry.json"
      - "compute-center/pipeline_adapters.py"
      - "compute-center/pipeline_engine.py"
      - "compute-center/compute_dispatch.py"
      - "compute-center/requirements.txt"
      - "compute-center/requirements-mesa.txt"
      - "compute-center/tests/test_pipeline_engine.py"
      - ".github/workflows/pipeline-orchestration-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-orchestration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements.txt
      - name: Install pinned core dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
      - name: Compile and validate pipeline control plane
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile pipeline_adapters.py pipeline_engine.py compute_dispatch.py
          python pipeline_engine.py validate
          python -m unittest tests.test_pipeline_engine tests.test_compute_runner -v
      - name: Enforce orchestration safety invariants
        working-directory: compute-center
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          for filename in ("pipeline_adapters.py", "pipeline_engine.py"):
              source = Path(filename).read_text(encoding="utf-8")
              for forbidden in (
                  "import requests",
                  "import socket",
                  "urllib.request",
                  "subprocess.",
                  "pickle.loads",
                  "import mcp",
              ):
                  assert forbidden not in source, (filename, forbidden)
              tree = ast.parse(source)
              calls = {
                  node.func.id
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
              }
              assert {"eval", "exec", "compile"}.isdisjoint(calls), filename

          registry = json.loads(Path("pipeline-registry.json").read_text(encoding="utf-8"))
          assert registry["engine"] == "networkx"
          assert registry["network_policy"] == "deny"
          assert registry["automatic_parallel_execution"] is False
          assert registry["dynamic_stage_injection_allowed"] is False
          assert registry["ticket_supplied_adapter_code_allowed"] is False
          assert registry["cycles_allowed"] is False
          PY
      - name: Execute frozen serial pipeline fixture
        working-directory: compute-center
        run: |
          set -euo pipefail
          rm -rf pipeline-orchestration-artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          import compute_runner
          from pipeline_engine import run_pipeline_ticket

          ticket = {
              "task_id": "pipeline-ci-0001",
              "operation": "scenario_compare",
              "inputs": {
                  "model": {
                      "intercept": 10.0,
                      "coefficients": {"demand": 2.0, "cost": -1.0},
                  },
                  "scenarios": [
                      {"name": "weak", "values": {"demand": 1.0, "cost": 4.0}},
                      {"name": "base", "values": {"demand": 2.0, "cost": 3.0}},
                      {"name": "strong", "values": {"demand": 4.0, "cost": 1.0}},
                  ],
              },
              "pipeline": {
                  "pipeline_id": "scenario-risk-linear-v1",
                  "stage_id": "pipeline",
                  "sequence_reason": "frozen CI fixture",
                  "upstream_refs": [],
              },
          }
          root = Path("pipeline-orchestration-artifacts")
          result = run_pipeline_ticket(ticket, root, compute_runner.OPERATIONS)
          state = json.loads((root / "compute-pipeline-state.json").read_text(encoding="utf-8"))
          assert state["status"] == "PASS"
          assert [row["stage_id"] for row in state["stages"]] == ["scenarios", "sensitivity", "risk_simulation"]
          assert all(row["status"] == "PASS" for row in state["stages"])
          assert result["execution"]["network_used"] is False
          assert result["execution"]["model_calls"] == 0
          assert result["execution"]["automatic_parallel_execution"] is False
          assert result["results"]["final_result"]["iterations"] == 5000
          assert result["results"]["final_result"]["seed"] == 20260807
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pipeline-orchestration-${{ github.run_id }}
          path: compute-center/pipeline-orchestration-artifacts/
          if-no-files-found: warn
          retention-days: 30
