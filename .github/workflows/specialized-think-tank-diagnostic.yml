name: Diagnose Exa Specialized Packs

on:
  pull_request:
    paths:
      - "compute-center/**"
      - ".github/workflows/specialized-think-tank-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specialized-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pack: policy
            requirements: requirements-thinktank-policy.txt
          - pack: forecast2
            requirements: requirements-thinktank-forecast2.txt
          - pack: decision2
            requirements: requirements-thinktank-decision2.txt
          - pack: spatial2
            requirements: requirements-thinktank-spatial2.txt
          - pack: infrastructure
            requirements: requirements-thinktank-infrastructure.txt
          - pack: health-operations
            requirements: requirements-thinktank-health-operations.txt
          - pack: finance-knowledge
            requirements: requirements-thinktank-finance-knowledge.txt
          - pack: assurance
            requirements: requirements-thinktank-assurance.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/${{ matrix.requirements }}
      - run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip install --disable-pip-version-check --no-input -r compute-center/${{ matrix.requirements }}
          python -m pip check
      - name: Run compact diagnostic
        id: diagnostic
        continue-on-error: true
        run: |
          mkdir -p specialized-diagnostic
          python compute-center/diagnose_specialized_packs.py \
            --pack "${{ matrix.pack }}" \
            --seed 42 \
            --output "specialized-diagnostic/${{ matrix.pack }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: specialized-diagnostic-${{ matrix.pack }}-${{ github.run_id }}
          path: specialized-diagnostic/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failure
        if: steps.diagnostic.outcome != 'success'
        run: exit 1
