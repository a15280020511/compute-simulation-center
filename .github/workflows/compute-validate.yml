name: Validate Compute Center

on:
  pull_request:
    paths:
      - "compute-center/**"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/compute-validate.yml"
      - ".github/workflows/repository-maintenance.yml"
      - ".github/dependabot.yml"
      - ".github/workflows/dependabot-auto-merge.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/**"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/compute-validate.yml"
      - ".github/workflows/repository-maintenance.yml"
      - ".github/dependabot.yml"
      - ".github/workflows/dependabot-auto-merge.yml"
  workflow_dispatch:
  schedule:
    - cron: "7 5 * * 0"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: validate-compute-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compute:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-finance.txt

      - name: Run isolated full compute health suite
        id: health
        shell: bash
        run: |
          set -o pipefail
          mkdir -p compute-validation-artifacts
          {
            python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
            python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements-finance.txt
            python -m pip check
            python -m pip install --disable-pip-version-check --no-input --dry-run --upgrade \
              -r compute-center/requirements.txt > compute-validation-artifacts/upgrade-dry-run.log
            python -m py_compile compute-center/*.py compute-center/tests/*.py
            python -m unittest discover -s compute-center/tests -v
            cp compute-center/golden-results.json compute-validation-artifacts/golden-results.json

            cat > /tmp/compute-health-ticket.json <<'JSON'
          {
            "task_id": "compute-health-20260727",
            "objective": "Deterministic compute-center health validation",
            "operation": "monte_carlo",
            "inputs": {
              "iterations": 100000,
              "seed": 20260727,
              "variables": [
                {"name": "constant", "distribution": "constant", "value": 2},
                {"name": "uniform", "distribution": "uniform", "minimum": 0, "maximum": 1},
                {"name": "triangular", "distribution": "triangular", "minimum": 0, "mode": 1, "maximum": 2},
                {"name": "normal", "distribution": "normal", "mean": 3, "standard_deviation": 1, "clip_minimum": 0, "clip_maximum": 6}
              ],
              "model": {
                "intercept": 0,
                "coefficients": {"constant": 1, "uniform": 1, "triangular": 1, "normal": 1}
              },
              "threshold": 4
            },
            "assumptions": [
              {
                "name": "full-health-fixture",
                "value": "constant, uniform, triangular and clipped normal",
                "basis": "deterministic maximum-iteration health fixture",
                "confidence": "high"
              }
            ]
          }
          JSON

            python compute-center/compute_dispatch.py \
              --ticket /tmp/compute-health-ticket.json \
              --output-dir compute-validation-artifacts/success-probe

            python - <<'PY'
          import json
          from pathlib import Path

          root = Path("compute-validation-artifacts/success-probe")
          result = json.loads((root / "compute-result.json").read_text(encoding="utf-8"))
          audit = json.loads((root / "compute-audit.json").read_text(encoding="utf-8"))
          diagnostics = json.loads((root / "compute-diagnostics.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "artifact-manifest.json").read_text(encoding="utf-8"))
          golden = json.loads(Path("compute-center/golden-results.json").read_text(encoding="utf-8"))

          assert result["status"] == "success"
          assert result["operation"] == "monte_carlo"
          assert result["results"]["iterations"] == 100000
          assert len(result["results"]["sensitivity"]) == 4
          assert result["execution"]["model_calls"] == 0
          assert result["execution"]["network_used"] is False
          assert result["execution"]["reproducible"] is True
          assert audit["status"] == "PASS"
          assert audit["secret_values_included"] is False
          assert diagnostics["schema_version"] == "compute-diagnostics-v2"
          assert diagnostics["status"] == "PASS"
          assert diagnostics["error_code"] == "NONE"
          assert diagnostics["stage_status"]["execute_operation"] == "PASS"
          assert diagnostics["security"]["secret_values_included"] is False
          assert diagnostics["security"]["ticket_content_embedded"] is False
          assert golden["version"] == 1 and len(golden["cases"]) >= 4
          manifest_paths = {row["path"] for row in manifest["files"]}
          assert "compute-result.json" in manifest_paths
          assert "compute-diagnostics.json" in manifest_paths
          PY

            cat > /tmp/compute-failure-ticket.json <<'JSON'
          {
            "task_id": "compute-diagnostic-failure-20260727",
            "objective": "Verify structured compute failure diagnostics",
            "operation": "break_even_analysis",
            "inputs": {
              "fixed_cost": 100,
              "unit_price": 10,
              "variable_cost": 10
            },
            "assumptions": [
              {
                "name": "controlled-invalid-margin",
                "value": 0,
                "basis": "diagnostic failure fixture",
                "confidence": "high"
              }
            ]
          }
          JSON

            set +e
            python compute-center/compute_dispatch.py \
              --ticket /tmp/compute-failure-ticket.json \
              --output-dir compute-validation-artifacts/failure-probe \
              > compute-validation-artifacts/failure-probe-console.log 2>&1
            failure_rc=$?
            set -e
            test "$failure_rc" -eq 2

            python - <<'PY'
          import json
          from pathlib import Path

          root = Path("compute-validation-artifacts/failure-probe")
          error = json.loads((root / "compute-error.json").read_text(encoding="utf-8"))
          diagnostics = json.loads((root / "compute-diagnostics.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "artifact-manifest.json").read_text(encoding="utf-8"))

          assert error["schema_version"] == "compute-error-v2"
          assert error["status"] == "error"
          assert error["stage"] == "execute_operation"
          assert error["error_code"] == "COMPUTE_REQUEST_INVALID"
          assert error["error_type"] == "ComputeError"
          assert "unit_price must exceed variable_cost" in error["message"]
          assert "ComputeError" in error["traceback"]
          assert error["task_id"] == "compute-diagnostic-failure-20260727"
          assert error["operation"] == "break_even_analysis"
          assert error["model_calls"] == 0
          assert error["network_used"] is False
          assert error["security"]["secret_values_included"] is False
          assert error["security"]["ticket_content_embedded"] is False

          assert diagnostics["schema_version"] == "compute-diagnostics-v2"
          assert diagnostics["status"] == "FAIL"
          assert diagnostics["primary_failure"]["code"] == "COMPUTE_REQUEST_INVALID"
          assert diagnostics["primary_failure"]["stage"] == "execute_operation"
          assert diagnostics["stage_status"]["execute_operation"] == "FAIL"
          assert diagnostics["remediation_hints"]

          manifest_paths = {row["path"] for row in manifest["files"]}
          assert "compute-error.json" in manifest_paths
          assert "compute-diagnostics.json" in manifest_paths
          PY
          } 2>&1 | tee compute-validation-artifacts/health.log

      - name: Audit upgrades, maintenance, and cleanup in read-only mode
        id: maintenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compute-validation-artifacts
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            | jq -s '[.[].artifacts[]]' > /tmp/compute-artifacts-inventory.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            | jq -s '[.[].actions_caches[]]' > /tmp/compute-caches-inventory.json
          python compute-center/maintenance_audit.py \
            --root . \
            --artifacts-json /tmp/compute-artifacts-inventory.json \
            --caches-json /tmp/compute-caches-inventory.json \
            --output compute-validation-artifacts/maintenance-audit.json \
            2>&1 | tee compute-validation-artifacts/maintenance-audit.log

      - name: Create cleanup probe
        if: always()
        run: |
          mkdir -p cleanup-probe
          printf 'temporary cleanup probe for run %s\n' "$GITHUB_RUN_ID" > cleanup-probe/probe.txt

      - name: Upload temporary cleanup probe
        id: probe_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compute-cleanup-probe-${{ github.run_id }}
          path: cleanup-probe/probe.txt
          if-no-files-found: error
          retention-days: 1

      - name: Delete and verify temporary cleanup probe
        id: cleanup_probe
        if: always() && steps.probe_upload.outcome == 'success'
        shell: bash
        env:
          PROBE_ARTIFACT_ID: ${{ steps.probe_upload.outputs['artifact-id'] }}
        run: |
          set -euo pipefail
          test -n "$PROBE_ARTIFACT_ID"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROBE_ARTIFACT_ID}"
          if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROBE_ARTIFACT_ID}" >/dev/null 2>&1; then
            echo "cleanup probe still exists after DELETE" >&2
            exit 1
          fi
          jq -n --arg id "$PROBE_ARTIFACT_ID" \
            '{version:1, status:"PASS", artifact_id:$id, deleted:true, verified_absent:true}' \
            > compute-validation-artifacts/cleanup-probe-result.json

      - name: Upload compute validation evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compute-center-validation-${{ github.run_id }}
          path: compute-validation-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Open or resolve scheduled compute-health incident
        if: always() && github.event_name == 'schedule'
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          MAINTENANCE_OUTCOME: ${{ steps.maintenance.outcome }}
          CLEANUP_PROBE_OUTCOME: ${{ steps.cleanup_probe.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          title='[compute-maintenance] Compute center health failed'
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Compute center health failed in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [[ "$HEALTH_OUTCOME" != "success" || "$MAINTENANCE_OUTCOME" != "success" || "$CLEANUP_PROBE_OUTCOME" != "success" || "$UPLOAD_OUTCOME" != "success" ]]; then
            body="Scheduled compute health failed in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. health=${HEALTH_OUTCOME}; maintenance=${MAINTENANCE_OUTCOME}; cleanup_probe=${CLEANUP_PROBE_OUTCOME}; upload=${UPLOAD_OUTCOME}."
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "Compute center health recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Report compute validation outcomes
        if: always()
        shell: bash
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          MAINTENANCE_OUTCOME: ${{ steps.maintenance.outcome }}
          PROBE_UPLOAD_OUTCOME: ${{ steps.probe_upload.outcome }}
          CLEANUP_PROBE_OUTCOME: ${{ steps.cleanup_probe.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          printf 'health=%s maintenance=%s probe_upload=%s cleanup_probe=%s upload=%s\n' \
            "$HEALTH_OUTCOME" "$MAINTENANCE_OUTCOME" "$PROBE_UPLOAD_OUTCOME" \
            "$CLEANUP_PROBE_OUTCOME" "$UPLOAD_OUTCOME"
          test "$HEALTH_OUTCOME" = success
          test "$MAINTENANCE_OUTCOME" = success
          test "$PROBE_UPLOAD_OUTCOME" = success
          test "$CLEANUP_PROBE_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
