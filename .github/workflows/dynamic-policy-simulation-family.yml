name: Validate Dynamic Policy Simulation Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_policy_simulation_planner.py"
      - "compute-center/dynamic_policy_simulation_adapters.py"
      - "compute-center/dynamic-policy-simulation-policy.json"
      - "compute-center/dynamic-policy-simulation-capability-graph.json"
      - "compute-center/dynamic-policy-simulation-stage-contracts.json"
      - "compute-center/think_tank_decision_operations.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/compute_runner.py"
      - "compute-center/operation_validation.py"
      - "compute-center/validate_dynamic_policy_simulation.py"
      - "compute-center/tests/test_dynamic_policy_simulation_family.py"
      - "compute-center/tests/test_dynamic_family_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-policy-simulation-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-policy-simulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
      - name: Install core and selector dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          PY
      - name: Compile policy-simulation dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_policy_simulation_adapters.py \
            dynamic_policy_simulation_planner.py \
            think_tank_decision_operations.py \
            decision_intelligence_gateway.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            operation_validation.py \
            validate_dynamic_policy_simulation.py \
            tests/test_dynamic_policy_simulation_family.py \
            tests/test_dynamic_family_router_coexistence.py
      - name: Run policy-simulation and existing lightweight dynamic regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_dynamic*.py' -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for policy-simulation family
        working-directory: compute-center
        run: python validate_dynamic_policy_simulation.py
