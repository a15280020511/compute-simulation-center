name: Validate Dynamic Control Response Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_control_response_planner.py"
      - "compute-center/dynamic_control_response_adapters.py"
      - "compute-center/dynamic-control-response-policy.json"
      - "compute-center/dynamic-control-response-capability-graph.json"
      - "compute-center/dynamic-control-response-stage-contracts.json"
      - "compute-center/think_tank_global_operations.py"
      - "compute-center/requirements-global-control.txt"
      - "compute-center/validate_dynamic_control_response.py"
      - "compute-center/tests/test_dynamic_control_response_family.py"
      - "compute-center/tests/test_dynamic_family_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-control-response-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-control-response-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-global-control.txt
      - name: Install core and control dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt \
            -r compute-center/requirements-global-control.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          assert version("control") == "0.10.2"
          PY
      - name: Compile control-response dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_control_response_adapters.py \
            dynamic_control_response_planner.py \
            think_tank_global_operations.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            operation_validation.py \
            validate_dynamic_control_response.py \
            tests/test_dynamic_control_response_family.py \
            tests/test_dynamic_family_router_coexistence.py
      - name: Run control-response and existing lightweight dynamic regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_dynamic*.py' -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for control-response family
        working-directory: compute-center
        run: python validate_dynamic_control_response.py
