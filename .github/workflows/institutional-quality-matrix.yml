name: Institutional Quality Matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pack: [core, finance, mesa, missing-data, diffusion, causal, bayesian-network, calibration, constraints, literature-evidence]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt -r requirements-dev.txt
          case "${{ matrix.pack }}" in
            finance) python -m pip install -r compute-center/requirements-finance.txt ;;
            mesa) python -m pip install -r compute-center/requirements-mesa.txt ;;
            missing-data) python -m pip install -r compute-center/requirements-missing-data.txt ;;
            diffusion) python -m pip install -r compute-center/requirements-diffusion.txt ;;
            causal) python -m pip install -r compute-center/requirements-causal.txt ;;
            bayesian-network) python -m pip install -r compute-center/requirements-bayesian-network.txt ;;
            calibration) python -m pip install -r compute-center/requirements-calibration.txt ;;
            constraints) python -m pip install -r compute-center/requirements-constraints.txt ;;
            literature-evidence) true ;;
          esac
          python -m pip check
      - name: Compile and run governed tests
        run: |
          set -euo pipefail
          python -m compileall -q compute-center
          PYTHONPATH=compute-center python -m unittest compute-center/tests/test_accuracy_enhancements.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('compute-center').rglob('*.json'): json.loads(p.read_text(encoding='utf-8'))
          PY
