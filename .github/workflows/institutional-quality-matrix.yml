name: Institutional Quality Matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pack: [core, finance, mesa, missing-data, diffusion, causal, bayesian-network, calibration, constraints, literature-evidence]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt -r requirements-dev.txt
          case "${{ matrix.pack }}" in
            finance) python -m pip install -r compute-center/requirements-finance.txt ;;
            mesa) python -m pip install -r compute-center/requirements-mesa.txt ;;
            missing-data) python -m pip install -r compute-center/requirements-missing-data.txt ;;
            diffusion) python -m pip install -r compute-center/requirements-diffusion.txt ;;
            causal) python -m pip install -r compute-center/requirements-causal.txt ;;
            bayesian-network) python -m pip install -r compute-center/requirements-bayesian-network.txt ;;
            calibration) python -m pip install -r compute-center/requirements-calibration.txt ;;
            constraints) python -m pip install -r compute-center/requirements-constraints.txt ;;
            literature-evidence) true ;;
          esac
          python -m pip check
      - name: Compile and run governed tests
        env:
          RUN_CVXPY_SMOKE: ${{ matrix.pack == 'constraints' && '1' || '0' }}
        run: |
          set -euo pipefail
          python -m compileall -q compute-center
          PYTHONPATH=compute-center python -m unittest compute-center/tests/test_accuracy_enhancements.py -v
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('compute-center').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          PY

  refresh-migration-manifest:
    if: github.event_name == 'pull_request' && github.head_ref == 'migration/from-test-v3'
    needs: matrix
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
      - name: Recalculate and update manifest if needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          manifest_path = root / 'POST_MIGRATION_MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          rows = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path == manifest_path:
                  continue
              if '.git' in path.parts or '__pycache__' in path.parts or path.suffix == '.pyc':
                  continue
              data = path.read_bytes()
              rows.append({
                  'path': path.as_posix(),
                  'size_bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest['file_count'] = len(rows)
          manifest['total_bytes'] = sum(row['size_bytes'] for row in rows)
          manifest['files'] = rows
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/POST_MIGRATION_MANIFEST.json?ref=${GITHUB_HEAD_REF}" --jq .sha)"
          encoded="$(base64 -w0 POST_MIGRATION_MANIFEST.json)"
          remote_content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/POST_MIGRATION_MANIFEST.json?ref=${GITHUB_HEAD_REF}" --jq .content | tr -d '\n')"
          if [[ "$encoded" != "$remote_content" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/POST_MIGRATION_MANIFEST.json" \
              -f message='chore: refresh compute migration manifest' \
              -f content="$encoded" \
              -f branch="$GITHUB_HEAD_REF" \
              -f sha="$current_sha"
          fi
