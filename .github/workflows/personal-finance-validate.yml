name: Validate Personal Finance Pack

on:
  pull_request:
    paths:
      - "compute-center/personal_finance_operations.py"
      - "compute-center/validate_personal_finance.py"
      - "compute-center/institutional-expansion-mode-registry.json"
      - "compute-center/capability_manager.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/tests/test_personal_finance.py"
      - "compute-center/tests/test_institutional_expansion.py"
      - "compute-center/tests/test_decision_intelligence_gateway.py"
      - ".github/workflows/personal-finance-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/personal_finance_operations.py"
      - "compute-center/validate_personal_finance.py"
      - "compute-center/institutional-expansion-mode-registry.json"
      - "compute-center/capability_manager.py"
      - "compute-center/decision_intelligence_gateway.py"
      - "compute-center/tests/test_personal_finance.py"
      - "compute-center/tests/test_institutional_expansion.py"
      - "compute-center/tests/test_decision_intelligence_gateway.py"
      - ".github/workflows/personal-finance-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-finance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements.txt
      - name: Install pinned core dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
      - name: Compile and validate governance
        working-directory: compute-center
        run: |
          python -m py_compile personal_finance_operations.py validate_personal_finance.py decision_intelligence_gateway.py
          python capability_manager.py validate
          python -m unittest tests.test_personal_finance tests.test_institutional_expansion -v
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('personal_finance_operations.py').read_text(encoding='utf-8')
          for forbidden in ('import requests', 'import socket', 'urllib.request', 'subprocess.', 'pickle.loads', 'import mcp', 'OPENROUTER_API_KEY'):
              assert forbidden not in source, forbidden
          tree = ast.parse(source)
          calls = {node.func.id for node in ast.walk(tree) if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)}
          assert {'eval', 'exec', 'compile'}.isdisjoint(calls)
          PY

  validate-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode:
          - goal_based_financial_plan
          - retirement_monte_carlo
          - sequence_of_returns_risk
          - liability_aware_allocation
          - emergency_fund_analysis
          - debt_repayment_optimization
          - withdrawal_strategy
          - insurance_protection_gap
          - household_cashflow_stress
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements.txt
      - name: Install pinned core dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
      - name: Execute fixed offline fixture
        working-directory: compute-center
        env:
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p personal-finance-artifacts
          python validate_personal_finance.py --mode "$MODE" --output "personal-finance-artifacts/${MODE}.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ['MODE']
          receipt = json.loads((Path('personal-finance-artifacts') / f'{mode}.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'PASS'
          assert receipt['mode'] == mode
          assert receipt['network_used'] is False
          assert receipt['model_calls'] == 0
          assert receipt['brokerage_execution'] is False
          assert receipt['account_access'] is False
          assert receipt['arbitrary_code_used'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: personal-finance-${{ matrix.mode }}-${{ github.run_id }}
          path: compute-center/personal-finance-artifacts/
          if-no-files-found: warn
          retention-days: 30

  matrix-receipt:
    if: always()
    needs: [core-governance, validate-mode]
    runs-on: ubuntu-24.04
    steps:
      - name: Write deterministic receipt
        env:
          CORE: ${{ needs.core-governance.result }}
          MODES: ${{ needs.validate-mode.result }}
        run: |
          {
            echo "## Personal Finance Pack Matrix"
            echo
            echo "- Core governance: ${CORE}"
            echo "- Nine-mode matrix: ${MODES}"
            echo "- Runtime network: denied / unused"
            echo "- Model calls: 0"
            echo "- Brokerage execution: false"
            echo "- Account access: false"
            echo "- Tax/legal/underwriting advice: not provided"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CORE" == "success" && "$MODES" == "success" ]]
