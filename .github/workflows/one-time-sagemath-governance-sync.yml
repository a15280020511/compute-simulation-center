name: One-time SageMath Governance Sync

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] sync SageMath governance catalogs 20260805 v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sagemath-capability-20260804
          persist-credentials: true
          fetch-depth: 0

      - name: Synchronize and validate governance catalogs
        id: repair
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/sagemath-governance-sync.log 2>&1
          import json
          from pathlib import Path

          root = Path('compute-center')
          governance_path = root / 'governance_catalog.py'
          text = governance_path.read_text(encoding='utf-8')

          old_return = '    return _schema("compute-ticket.schema.json")\n'
          new_return = (
              '    primary_ticket_schema = _schema("compute-ticket.schema.json")\n'
              '    dedicated_ticket_schemas = [_schema("sagemath-ticket.schema.json")]\n'
              '    return {\n'
              '        "primary": primary_ticket_schema,\n'
              '        "dedicated": dedicated_ticket_schemas,\n'
              '    }\n'
          )
          if old_return not in text:
              raise RuntimeError('expected ticket schema return block not found')
          text = text.replace(old_return, new_return, 1)

          old_ticket = '    ticket_operations = set(ticket_schema["properties"]["operation"]["enum"])\n'
          new_ticket = (
              '    ticket_operations = set(ticket_schema["primary"]["properties"]["operation"]["enum"])\n'
              '    for dedicated_schema in ticket_schema["dedicated"]:\n'
              '        operation_schema = dedicated_schema["properties"]["operation"]\n'
              '        if "const" in operation_schema:\n'
              '            ticket_operations.add(str(operation_schema["const"]))\n'
              '        else:\n'
              '            ticket_operations.update(str(item) for item in operation_schema.get("enum", []))\n'
          )
          if old_ticket not in text:
              raise RuntimeError('expected ticket operation line not found')
          text = text.replace(old_ticket, new_ticket, 1)
          governance_path.write_text(text, encoding='utf-8')

          model_path = root / 'model-registry.json'
          registry = json.loads(model_path.read_text(encoding='utf-8'))
          models = registry['models']
          if any(row.get('operation') == 'symbolic_mathematics' for row in models):
              raise RuntimeError('symbolic model row already exists unexpectedly')
          models.append({
              'model_id': 'symbolic_mathematics-sagemath-10.9-v1',
              'operation': 'symbolic_mathematics',
              'maturity': 'controlled-preview',
              'engineering_maturity': 'controlled-preview',
              'evidence_maturity': 'experimental',
              'risk_tier': 'medium',
              'calibration_supported': False,
              'allowed_backends': [],
              'intended_use': [
                  'Bounded exact symbolic algebra, calculus, matrix analysis and number theory through the pinned SageMath runtime.'
              ],
              'prohibited_use': [
                  'Ticket-supplied Sage or Python code',
                  'External network access',
                  'Expressions outside the fixed allowlist and size bounds'
              ],
              'theoretical_basis': 'Exact and symbolic computation through SageMath 10.9 in a digest-pinned, read-only, network-denied container.',
              'known_failure_conditions': [
                  'Inputs outside the dedicated ticket schema',
                  'Unsupported symbolic forms or resource limits',
                  'Pinned runtime unavailable before the offline execution stage'
              ],
              'assurance_owner': 'compute-quality-gate',
              'revalidation_trigger': [
                  'runtime_digest_change',
                  'schema_change',
                  'dependency_change',
                  'scope_change'
              ]
          })
          models.sort(key=lambda row: str(row.get('operation') or ''))
          model_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rc=$?
          if [ "$rc" -eq 0 ]; then
            python -m py_compile compute-center/governance_catalog.py >> /tmp/sagemath-governance-sync.log 2>&1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            python compute-center/governance_catalog.py >> /tmp/sagemath-governance-sync.log 2>&1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            git diff --check >> /tmp/sagemath-governance-sync.log 2>&1 || rc=$?
          fi
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit exact feature-branch repair
        if: steps.repair.outputs.exit_code == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compute-center/governance_catalog.py compute-center/model-registry.json
          git commit -m 'fix: synchronize SageMath governance catalogs'
          git push origin HEAD:feat/sagemath-capability-20260804
          echo 'commit_and_push=success' >> /tmp/sagemath-governance-sync.log

      - name: Record diagnostic receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXIT_CODE: ${{ steps.repair.outputs.exit_code }}
        run: |
          {
            echo '## SageMath governance sync receipt'
            echo
            echo "- Exit code: \`${EXIT_CODE:-missing}\`"
            echo '- Target branch: `feat/sagemath-capability-20260804`'
            echo
            echo '```text'
            tail -n 80 /tmp/sagemath-governance-sync.log 2>/dev/null || true
            echo '```'
          } > /tmp/issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue-comment.md
          test "${EXIT_CODE:-missing}" = '0'
