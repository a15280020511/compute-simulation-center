name: One-time SageMath Governance Sync

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  sync:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] sync SageMath governance catalogs 20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sagemath-capability-20260804
          persist-credentials: true
          fetch-depth: 0

      - name: Synchronize dedicated ticket and model governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('compute-center')
          path = root / 'governance_catalog.py'
          text = path.read_text(encoding='utf-8')

          old_return = '    return _schema("compute-ticket.schema.json")\n'
          new_return = '''    primary_ticket_schema = _schema("compute-ticket.schema.json")
              dedicated_ticket_schemas = [_schema("sagemath-ticket.schema.json")]
              return {
                  "primary": primary_ticket_schema,
                  "dedicated": dedicated_ticket_schemas,
              }
          '''.replace('          ', '')
          if old_return not in text:
              raise SystemExit('expected ticket schema return block not found')
          text = text.replace(old_return, new_return, 1)

          old_ticket = '    ticket_operations = set(ticket_schema["properties"]["operation"]["enum"])\n'
          new_ticket = '''    ticket_operations = set(ticket_schema["primary"]["properties"]["operation"]["enum"])
              for dedicated_schema in ticket_schema["dedicated"]:
                  operation_schema = dedicated_schema["properties"]["operation"]
                  if "const" in operation_schema:
                      ticket_operations.add(str(operation_schema["const"]))
                  else:
                      ticket_operations.update(str(item) for item in operation_schema.get("enum", []))
          '''.replace('          ', '')
          if old_ticket not in text:
              raise SystemExit('expected ticket operation line not found')
          text = text.replace(old_ticket, new_ticket, 1)
          path.write_text(text, encoding='utf-8')

          model_path = root / 'model-registry.json'
          registry = json.loads(model_path.read_text(encoding='utf-8'))
          models = registry['models']
          if not any(row.get('operation') == 'symbolic_mathematics' for row in models):
              models.append({
                  'model_id': 'symbolic_mathematics-sagemath-10.9-v1',
                  'operation': 'symbolic_mathematics',
                  'maturity': 'controlled-preview',
                  'engineering_maturity': 'controlled-preview',
                  'evidence_maturity': 'experimental',
                  'risk_tier': 'medium',
                  'calibration_supported': False,
                  'allowed_backends': [],
                  'intended_use': [
                      'Bounded exact symbolic algebra, calculus, matrix analysis and number theory through the pinned SageMath runtime.'
                  ],
                  'prohibited_use': [
                      'Ticket-supplied Sage or Python code',
                      'External network access',
                      'Expressions outside the fixed allowlist and size bounds'
                  ],
                  'theoretical_basis': 'Exact and symbolic computation through SageMath 10.9 in a digest-pinned, read-only, network-denied container.',
                  'known_failure_conditions': [
                      'Inputs outside the dedicated ticket schema',
                      'Unsupported symbolic forms or resource limits',
                      'Pinned runtime unavailable before the offline execution stage'
                  ],
                  'assurance_owner': 'compute-quality-gate',
                  'revalidation_trigger': [
                      'runtime_digest_change',
                      'schema_change',
                      'dependency_change',
                      'scope_change'
                  ]
              })
              models.sort(key=lambda row: str(row.get('operation') or ''))
          model_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate synchronized catalogs
        run: |
          python -m py_compile compute-center/governance_catalog.py
          python compute-center/governance_catalog.py
          python compute-center/tool_registry.py validate
          python compute-center/systems_matrix.py validate
          git diff --check

      - name: Commit exact feature-branch repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compute-center/governance_catalog.py compute-center/model-registry.json
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: synchronize SageMath governance catalogs'
          git push origin HEAD:feat/sagemath-capability-20260804
