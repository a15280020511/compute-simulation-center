name: Managed Certified Math

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: compute-certified-math-global
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[compute-certified-math]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/certified-math/requirements.txt

      - name: Install pinned certified dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/certified-math/requirements.txt
          python -m pip check

      - name: Extract ticket
        run: |
          mkdir -p certified-math-artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          body = str(event.get('issue', {}).get('body') or '').strip()
          if not body:
              raise SystemExit('issue body is empty')
          value = json.loads(body)
          Path('certified-math-ticket.json').write_text(json.dumps(value, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Execute one offline certified operation
        id: execute
        continue-on-error: true
        run: |
          python compute-center/certified_math_task.py \
            --ticket certified-math-ticket.json \
            --output-dir certified-math-artifacts | tee certified-math-console.json

      - name: Upload evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certified-math-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            certified-math-artifacts/
            certified-math-ticket.json
            certified-math-console.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish result
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt_path = Path('certified-math-artifacts/certified-math-receipt.json')
          if receipt_path.is_file():
              receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
              result = receipt.get('result') or {}
              lines = [
                  f"Certified Math result: `{receipt.get('status')}`",
                  "",
                  f"- Operation: `{receipt.get('operation')}`",
                  f"- Duration: `{receipt.get('duration_ms')} ms`",
                  f"- Network calls: `{receipt.get('network_calls')}`",
                  f"- Model calls: `{receipt.get('model_calls')}`",
                  f"- Receipt SHA256: `{receipt.get('receipt_sha256')}`",
                  f"- Result status/value: `{result.get('status') or result.get('exact_value') or result.get('exact_rational') or 'see artifact'}`",
                  f"- Artifact: {os.environ.get('ARTIFACT_URL') or 'unavailable'}",
              ]
          else:
              lines = [
                  "Certified Math result: `WORKFLOW_FAILED_BEFORE_RECEIPT`",
                  "",
                  f"- Artifact: {os.environ.get('ARTIFACT_URL') or 'unavailable'}",
              ]
          Path('certified-math-comment.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@certified-math-comment.md

      - name: Mark failed execution
        if: always() && (steps.execute.outcome != 'success' || steps.upload.outcome != 'success')
        run: exit 1
