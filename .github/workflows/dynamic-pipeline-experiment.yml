name: Validate Dynamic NetworkX Orchestration Experiment

on:
  pull_request:
    paths:
      - "compute-center/dynamic-orchestration-policy.json"
      - "compute-center/dynamic_pipeline_planner.py"
      - "compute-center/tests/test_dynamic_pipeline_planner.py"
      - ".github/workflows/dynamic-pipeline-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-pipeline-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements.txt
      - name: Install core dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
      - name: Compile and run dynamic orchestration tests
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile dynamic_pipeline_planner.py
          python -m unittest tests.test_dynamic_pipeline_planner -v
      - name: Verify four distinct plans and safety invariants
        working-directory: compute-center
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          from dynamic_pipeline_planner import plan_dynamic_pipeline

          base = {
              "task_id": "dynamic-ci-base",
              "operation": "scenario_compare",
              "inputs": {
                  "model": {"intercept": 10.0, "coefficients": {"demand": 2.0, "cost": -1.0}},
                  "scenarios": [
                      {"name": "weak", "values": {"demand": 1.0, "cost": 4.0}},
                      {"name": "base", "values": {"demand": 2.0, "cost": 3.0}},
                      {"name": "strong", "values": {"demand": 4.0, "cost": 1.0}},
                  ],
              },
              "quality_profile": {"decision_class": "exploratory", "probabilistic_claim": False},
          }
          cases = []
          a = copy.deepcopy(base); a["task_id"] = "dynamic-ci-a"; a["inputs"]["scenarios"] = a["inputs"]["scenarios"][:2]; cases.append(a)
          b = copy.deepcopy(base); b["task_id"] = "dynamic-ci-b"; cases.append(b)
          c = copy.deepcopy(base); c["task_id"] = "dynamic-ci-c"; c["inputs"]["scenarios"] = c["inputs"]["scenarios"][:2]; c["quality_profile"]["probabilistic_claim"] = True; cases.append(c)
          d = copy.deepcopy(base); d["task_id"] = "dynamic-ci-d"; d["data_context"] = {"variables": [
              {"name": "u1", "required": True, "source_type": "proxy", "confidence": "medium"},
              {"name": "u2", "required": True, "source_type": "proxy", "confidence": "medium"},
          ]}; cases.append(d)
          plans = [plan_dynamic_pipeline(item) for item in cases]
          orders = [plan["stage_order"] for plan in plans]
          assert len({tuple(order) for order in orders}) == 4, orders
          assert all(plan["objective_text_used"] is False for plan in plans)
          assert all(plan["network_policy"] == "deny" for plan in plans)
          assert all(plan["automatic_parallel_execution"] is False for plan in plans)
          assert all(plan["model_calls"] == 0 for plan in plans)
          print(json.dumps({"status": "PASS", "stage_orders": orders}, ensure_ascii=False, indent=2))
          PY
