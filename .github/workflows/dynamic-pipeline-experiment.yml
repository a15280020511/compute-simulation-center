name: Validate Policy-Optimal Dynamic Orchestration

on:
  pull_request:
    paths:
      - "compute-center/dynamic-orchestration-policy.json"
      - "compute-center/dynamic-capability-graph.json"
      - "compute-center/dynamic_pipeline_planner.py"
      - "compute-center/pipeline_adapters.py"
      - "compute-center/operation-contract-registry.json"
      - "compute-center/validate_dynamic_generic.py"
      - "compute-center/compute_dispatch.py"
      - "compute-center/tool_registry.py"
      - "compute-center/requirements-ortools.txt"
      - "compute-center/tests/test_dynamic_pipeline_planner.py"
      - "compute-center/tests/test_dynamic_runtime_integration.py"
      - "compute-center/tests/test_dynamic_generic_extensions.py"
      - ".github/workflows/dynamic-pipeline-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-pipeline-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
      - name: Install core and pinned optimization dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt
          python -m pip check
      - name: Compile generic orchestration runtime
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_pipeline_planner.py \
            pipeline_adapters.py \
            validate_dynamic_generic.py \
            compute_dispatch.py \
            tool_registry.py
      - name: Run dynamic planner and runtime regression suite
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_dynamic_pipeline_planner \
            tests.test_dynamic_runtime_integration \
            tests.test_dynamic_generic_extensions -v
      - name: Verify generic policy-optimal selection and production dispatcher
        working-directory: compute-center
        run: python validate_dynamic_generic.py
