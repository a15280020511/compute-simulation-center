name: Validate Policy-Optimal Dynamic Orchestration

on:
  pull_request:
    paths:
      - "compute-center/dynamic-orchestration-policy.json"
      - "compute-center/dynamic-capability-graph.json"
      - "compute-center/dynamic_pipeline_planner.py"
      - "compute-center/compute_dispatch.py"
      - "compute-center/tool_registry.py"
      - "compute-center/requirements-ortools.txt"
      - "compute-center/requirements-finance.txt"
      - "compute-center/tests/test_dynamic_pipeline_planner.py"
      - "compute-center/tests/test_dynamic_runtime_integration.py"
      - ".github/workflows/dynamic-pipeline-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-pipeline-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
      - name: Install core and pinned optimization dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt
          python -m pip check
      - name: Compile and run policy-optimal dynamic orchestration tests
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile dynamic_pipeline_planner.py compute_dispatch.py tool_registry.py
          python -m unittest \
            tests.test_dynamic_pipeline_planner \
            tests.test_dynamic_runtime_integration -v
      - name: Enforce dynamic-planner safety invariants
        working-directory: compute-center
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          source = Path("dynamic_pipeline_planner.py").read_text(encoding="utf-8")
          for forbidden in (
              "import requests",
              "import socket",
              "urllib.request",
              "subprocess.",
              "pickle.loads",
              "import mcp",
          ):
              assert forbidden not in source, forbidden
          tree = ast.parse(source)
          direct_calls = {
              node.func.id
              for node in ast.walk(tree)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
          }
          assert {"eval", "exec", "compile"}.isdisjoint(direct_calls)

          policy = json.loads(Path("dynamic-orchestration-policy.json").read_text(encoding="utf-8"))
          assert policy["status"] == "controlled-preview"
          assert policy["planner"] == "ortools-cp-sat"
          assert policy["graph_engine"] == "networkx"
          assert policy["solver_policy"]["require_optimal_status"] is True
          assert policy["solver_policy"]["num_search_workers"] == 1
          assert policy["objective_text_routing_allowed"] is False
          assert policy["dynamic_operation_discovery_allowed"] is False
          assert policy["ticket_supplied_code_allowed"] is False
          assert policy["automatic_parallel_execution"] is False
          assert policy["cycles_allowed"] is False
          assert policy["production_activation"] == {
              "pipeline_id": "dynamic-auto-v1",
              "stage_id": "dynamic",
              "entry_operation": "scenario_compare",
          }
          PY
      - name: Verify four distinct globally optimal plans
        working-directory: compute-center
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          from dynamic_pipeline_planner import plan_dynamic_pipeline

          base = {
              "task_id": "dynamic-ci-base",
              "operation": "scenario_compare",
              "inputs": {
                  "model": {"intercept": 10.0, "coefficients": {"demand": 2.0, "cost": -1.0}},
                  "scenarios": [
                      {"name": "weak", "values": {"demand": 1.0, "cost": 4.0}},
                      {"name": "base", "values": {"demand": 2.0, "cost": 3.0}},
                      {"name": "strong", "values": {"demand": 4.0, "cost": 1.0}},
                  ],
              },
              "quality_profile": {"decision_class": "exploratory", "probabilistic_claim": False},
          }
          cases = []
          a = copy.deepcopy(base); a["task_id"] = "dynamic-ci-a"; a["inputs"]["scenarios"] = a["inputs"]["scenarios"][:2]; cases.append(a)
          b = copy.deepcopy(base); b["task_id"] = "dynamic-ci-b"; cases.append(b)
          c = copy.deepcopy(base); c["task_id"] = "dynamic-ci-c"; c["inputs"]["scenarios"] = c["inputs"]["scenarios"][:2]; c["quality_profile"]["probabilistic_claim"] = True; cases.append(c)
          d = copy.deepcopy(base); d["task_id"] = "dynamic-ci-d"; d["data_context"] = {"variables": [
              {"name": "u1", "required": True, "source_type": "proxy", "confidence": "medium"},
              {"name": "u2", "required": True, "source_type": "proxy", "confidence": "medium"},
          ]}; cases.append(d)

          plans = [plan_dynamic_pipeline(item) for item in cases]
          orders = [plan["stage_order"] for plan in plans]
          assert len({tuple(order) for order in orders}) == 4, orders
          for plan in plans:
              optimization = plan["optimization"]
              cross = optimization["exhaustive_cross_check"]
              assert plan["selection_engine"] == "ortools-cp-sat"
              assert plan["graph_engine"] == "networkx"
              assert optimization["solver_status"] == "OPTIMAL"
              assert optimization["global_optimal_proven"] is True
              assert cross["performed"] is True and cross["passed"] is True
              assert optimization["objective_value"] == cross["best_objective"]
              assert optimization["solver_policy"]["num_search_workers"] == 1
              assert plan["objective_text_used"] is False
              assert plan["network_policy"] == "deny"
              assert plan["automatic_parallel_execution"] is False
              assert plan["model_calls"] == 0
          print(json.dumps({
              "status": "PASS",
              "selection_engine": "ortools-cp-sat",
              "graph_engine": "networkx",
              "global_optimal_proven": True,
              "stage_orders": orders,
              "objective_values": [plan["optimization"]["objective_value"] for plan in plans],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Exercise production dispatcher with explicit dynamic ticket
        working-directory: compute-center
        run: |
          set -euo pipefail
          rm -rf dynamic-production-sim
          cat > dynamic-production-ticket.json <<'JSON'
          {
            "task_id": "dynamic-production-sim-20260807",
            "objective": "Validate the controlled-preview dynamic orchestration production route.",
            "operation": "scenario_compare",
            "inputs": {
              "model": {
                "intercept": 10.0,
                "coefficients": {"demand": 2.0, "cost": -1.0}
              },
              "scenarios": [
                {"name": "weak", "values": {"demand": 1.0, "cost": 4.0}},
                {"name": "base", "values": {"demand": 2.0, "cost": 3.0}},
                {"name": "strong", "values": {"demand": 4.0, "cost": 1.0}}
              ]
            },
            "pipeline": {
              "pipeline_id": "dynamic-auto-v1",
              "stage_id": "dynamic",
              "sequence_reason": "CI production dispatcher simulation",
              "upstream_refs": []
            },
            "preflight_policy": {
              "enforcement": "advisory",
              "allow_assumptions": true,
              "allow_proxy": true,
              "require_user_approval_for_low_confidence": false,
              "max_assumption_ratio": 1.0,
              "small_sample_threshold": 2,
              "outlier_rate_threshold": 1.0
            },
            "quality_profile": {
              "decision_class": "exploratory",
              "probabilistic_claim": true,
              "benchmark_ids": [],
              "method_ids": [],
              "sample_ids": [],
              "rule_ids": [],
              "independent_cross_check_passed": false,
              "publication_policy": "status_only"
            }
          }
          JSON

          mapfile -t requirements < <(python tool_registry.py requirements --ticket dynamic-production-ticket.json)
          test "${#requirements[@]}" -eq 1
          test "$(basename "${requirements[0]}")" = "requirements-ortools.txt"
          python tool_registry.py plan --ticket dynamic-production-ticket.json > dynamic-runtime-plan.json
          python compute_dispatch.py \
            --ticket dynamic-production-ticket.json \
            --output-dir dynamic-production-sim

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dynamic-production-sim")
          result = json.loads((root / "compute-result.json").read_text(encoding="utf-8"))
          state = json.loads((root / "compute-dynamic-pipeline-state.json").read_text(encoding="utf-8"))
          audit = json.loads((root / "compute-audit.json").read_text(encoding="utf-8"))
          plan = json.loads(Path("dynamic-runtime-plan.json").read_text(encoding="utf-8"))

          assert plan["capability_pack"] == "dynamic-orchestration"
          assert plan["requirements"] and plan["requirements"][0].endswith("requirements-ortools.txt")
          assert result["status"] == "success"
          assert result["results"]["pipeline_id"] == "dynamic-auto-v1"
          assert result["results"]["selection_engine"] == "ortools-cp-sat"
          assert result["results"]["graph_engine"] == "networkx"
          assert result["results"]["stage_order"] == ["scenarios", "sensitivity", "risk_simulation"]
          assert result["results"]["optimization"]["solver_status"] == "OPTIMAL"
          assert result["results"]["optimization"]["global_optimal_proven"] is True
          assert result["execution"]["network_used"] is False
          assert result["execution"]["model_calls"] == 0
          assert result["execution"]["automatic_parallel_execution"] is False
          assert state["status"] == "PASS"
          assert all(row["status"] == "PASS" for row in state["stages"])
          assert audit["network_used"] is False
          assert audit["model_calls"] == 0
          assert audit["global_optimal_proven"] is True
          assert result["quality"]["observed_evidence_maturity"] == "controlled-preview"
          print(json.dumps({
              "status": "PASS",
              "stage_order": result["results"]["stage_order"],
              "solver_status": result["results"]["optimization"]["solver_status"],
              "global_optimal_proven": result["results"]["optimization"]["global_optimal_proven"],
              "release_status": result["quality"]["release_status"],
              "network_used": result["execution"]["network_used"],
              "model_calls": result["execution"]["model_calls"],
          }, ensure_ascii=False, indent=2))
          PY
