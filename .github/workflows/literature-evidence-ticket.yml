name: Literature Evidence Ticket

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: literature-evidence-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute-literature-evidence:
    if: >-
      github.actor == github.repository_owner &&
      (startsWith(github.event.issue.title, '[literature]') ||
       startsWith(github.event.issue.title, '[compute-literature]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: compute-literature-evidence
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements.txt

      - name: Install ticket validation dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
          python -m pip check

      - name: Compile fixed literature control plane
        run: |
          python -m py_compile \
            compute-center/literature-evidence/literature_evidence.py \
            compute-center/literature-evidence/literature_ticket.py

      - name: Parse authorize and freeze ticket
        id: prepare
        continue-on-error: true
        run: |
          python compute-center/literature-evidence/literature_ticket.py prepare \
            --event-path "$GITHUB_EVENT_PATH" \
            --output-dir literature-artifacts

      - name: Reject duplicate task ID
        id: duplicate
        if: steps.prepare.outputs.accepted == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          task_id='${{ steps.prepare.outputs.task_id }}'
          count="$(gh api --method GET search/issues \
            -f q="repo:${GITHUB_REPOSITORY} is:issue in:body \"${task_id}\"" \
            --jq "[.items[] | select(.number != ${ISSUE_NUMBER}) | select(.title | startswith(\"[literature]\") or startswith(\"[compute-literature]\"))] | length")"
          if [[ "$count" != "0" ]]; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "duplicate=false" >> "$GITHUB_OUTPUT"

      - name: Comment accepted ticket
        if: steps.prepare.outputs.accepted == 'true' && steps.duplicate.outcome == 'success'
        run: |
          python compute-center/literature-evidence/literature_ticket.py render \
            --phase accepted \
            --output-dir literature-artifacts \
            --run-url "$RUN_URL" > literature-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@literature-comment.md

      - name: Comment rejected ticket
        if: steps.prepare.outputs.accepted != 'true' || steps.duplicate.outcome != 'success'
        shell: bash
        run: |
          if [[ "${{ steps.duplicate.outcome }}" != "success" && "${{ steps.prepare.outputs.accepted }}" == "true" ]]; then
            cat > literature-comment.md <<EOF
          ## LITERATURE_TICKET_REJECTED

          - Reason: \`duplicate task_id already exists in another literature Issue\`
          - External requests: \`0\`
          - Run: ${RUN_URL}
          EOF
          else
            python compute-center/literature-evidence/literature_ticket.py render \
              --phase rejected \
              --output-dir literature-artifacts \
              --run-url "$RUN_URL" > literature-comment.md
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@literature-comment.md

      - name: Execute allowlisted literature request plan
        id: execute
        if: steps.prepare.outputs.accepted == 'true' && steps.duplicate.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python compute-center/literature-evidence/literature_ticket.py execute \
            --ticket literature-artifacts/ticket.json \
            --output-dir literature-artifacts \
            2>&1 | tee literature-artifacts/literature-console.log

      - name: Refresh Artifact manifest after console capture
        if: always() && steps.prepare.outputs.accepted == 'true' && steps.duplicate.outcome == 'success'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('literature-artifacts')
          rows = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'artifact-manifest.json':
                  data = path.read_bytes()
                  rows.append({
                      'path': path.relative_to(root).as_posix(),
                      'size_bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
          (root / 'artifact-manifest.json').write_text(json.dumps({
              'schema_version': 'literature-evidence-artifact-manifest-v1',
              'created_at': datetime.now(timezone.utc).isoformat(),
              'files': rows,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload frozen literature evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: literature-evidence-${{ github.event.issue.number }}-${{ github.run_id }}
          path: literature-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish verified completion
        id: publish_success
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success' &&
          steps.execute.outcome == 'success' &&
          steps.upload.outcome == 'success' &&
          steps.upload.outputs['artifact-id'] != ''
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs['artifact-url'] }}
        run: |
          python compute-center/literature-evidence/literature_ticket.py render \
            --phase completed \
            --output-dir literature-artifacts \
            --run-url "$RUN_URL" \
            --artifact-url "$ARTIFACT_URL" > literature-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@literature-comment.md

      - name: Publish structured failure
        id: publish_failure
        if: >-
          steps.prepare.outputs.accepted == 'true' &&
          steps.duplicate.outcome == 'success' &&
          (steps.execute.outcome != 'success' ||
           steps.upload.outcome != 'success' ||
           steps.upload.outputs['artifact-id'] == '')
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs['artifact-url'] }}
        run: |
          python compute-center/literature-evidence/literature_ticket.py render \
            --phase failed \
            --output-dir literature-artifacts \
            --run-url "$RUN_URL" \
            --artifact-url "$ARTIFACT_URL" > literature-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -F body=@literature-comment.md

      - name: Fail rejected duplicate or unsuccessful execution
        if: >-
          always() &&
          (steps.prepare.outputs.accepted != 'true' ||
           steps.duplicate.outcome != 'success' ||
           steps.execute.outcome != 'success' ||
           steps.upload.outcome != 'success' ||
           steps.upload.outputs['artifact-id'] == '' ||
           steps.publish_success.outcome != 'success')
        run: exit 1
