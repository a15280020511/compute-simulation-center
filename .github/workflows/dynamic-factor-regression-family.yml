name: Validate Dynamic Factor Regression Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_factor_regression_planner.py"
      - "compute-center/dynamic_factor_regression_adapters.py"
      - "compute-center/dynamic-factor-regression-policy.json"
      - "compute-center/dynamic-factor-regression-capability-graph.json"
      - "compute-center/dynamic-factor-regression-stage-contracts.json"
      - "compute-center/quantitative_operations.py"
      - "compute-center/requirements-finance.txt"
      - "compute-center/validate_dynamic_factor_regression.py"
      - "compute-center/tests/test_dynamic_factor_regression_family.py"
      - "compute-center/tests/test_dynamic_factor_regression_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-factor-regression-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-factor-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-finance.txt
      - name: Install core and factor-regression dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-finance.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          assert version("statsmodels") == "0.14.6"
          PY
      - name: Compile factor-regression dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_factor_regression_adapters.py \
            dynamic_factor_regression_planner.py \
            quantitative_operations.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            operation_validation.py \
            validate_dynamic_factor_regression.py \
            tests/test_dynamic_factor_regression_family.py \
            tests/test_dynamic_factor_regression_router_coexistence.py
      - name: Run factor-regression and existing lightweight dynamic regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_dynamic*.py' -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for factor-regression family
        working-directory: compute-center
        run: python validate_dynamic_factor_regression.py
