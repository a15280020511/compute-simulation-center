name: Validate Compute Maximum Load

on:
  pull_request:
    paths:
      - "compute-center/**"
      - ".github/workflows/compute-stress-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/**"
      - ".github/workflows/compute-stress-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-compute-maximum-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maximum-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements.txt

      - name: Install bounded core environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
          python -m py_compile compute-center/*.py compute-center/tests/*.py

      - name: Execute maximum-load suite inside network namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compute-stress-artifacts
          PYTHON_BIN="$(command -v python)"
          WORKSPACE="$GITHUB_WORKSPACE"
          sudo unshare --net --mount-proc bash -c "
            set -euo pipefail
            cd '$WORKSPACE'
            /usr/bin/time -v '$PYTHON_BIN' compute-center/stress_validation.py \
              --output compute-stress-artifacts/stress-summary.json \
              2>&1 | tee compute-stress-artifacts/stress-console.log
          "

      - name: Verify stress evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path('compute-stress-artifacts/stress-summary.json').read_text(encoding='utf-8')
          )
          assert summary['schema_version'] == 'compute-stress-validation-v1', summary
          assert summary['status'] == 'PASS', summary
          assert summary['case_count'] == 13, summary
          assert summary['passed'] == 13 and summary['failed'] == 0, summary
          assert summary['network_used'] is False, summary
          assert summary['model_calls'] == 0, summary
          assert summary['parallel_compute_execution_used'] is False, summary
          assert len(summary['summary_sha256']) == 64, summary
          expected = {
              'max_monte_carlo_100k_x_50',
              'max_sensitivity_50',
              'max_scenarios_50_x_50',
              'max_linear_optimization_50_x_200',
              'max_descriptive_statistics_100k',
              'max_discrete_event_10k',
              'max_repeated_game_500k',
              'max_agent_evolution_20_x_10k',
              'max_time_series_100k_h1000',
              'max_nonlinear_dynamics_2000',
              'max_markov_50_x_1000',
              'sequential_dispatch_isolation_25',
              'boundary_fail_closed',
          }
          assert {row['case'] for row in summary['rows']} == expected, summary
          PY

      - name: Upload maximum-load evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compute-maximum-load-${{ github.run_id }}
          path: compute-stress-artifacts/
          if-no-files-found: error
          retention-days: 30
