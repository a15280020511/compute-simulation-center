name: Validate Dynamic Bayesian Network Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_bayesian_network_planner.py"
      - "compute-center/dynamic_bayesian_adapters.py"
      - "compute-center/dynamic-bayesian-policy.json"
      - "compute-center/dynamic-bayesian-capability-graph.json"
      - "compute-center/dynamic-bayesian-stage-contracts.json"
      - "compute-center/bayesian_network_operations.py"
      - "compute-center/tool_registry.py"
      - "compute-center/requirements-bayesian-network.txt"
      - "compute-center/validate_dynamic_bayesian_network.py"
      - "compute-center/tests/test_dynamic_bayesian_network_family.py"
      - "compute-center/tests/test_dynamic_family_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-bayesian-network-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-bayesian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-bayesian-network.txt
      - name: Install core optimization and Bayesian dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt \
            -r compute-center/requirements-bayesian-network.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("pgmpy") == "1.1.2"
          PY
      - name: Compile Bayesian dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_bayesian_adapters.py \
            dynamic_bayesian_network_planner.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            tool_registry.py \
            validate_dynamic_bayesian_network.py \
            tests/test_dynamic_bayesian_network_family.py \
            tests/test_dynamic_family_router_coexistence.py
      - name: Run Bayesian and existing dynamic-family regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_dynamic_bayesian_network_family \
            tests.test_dynamic_family_router_coexistence \
            tests.test_dynamic_time_series_family \
            tests.test_dynamic_pipeline_planner \
            tests.test_dynamic_runtime_integration \
            tests.test_dynamic_generic_extensions -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for Bayesian family
        working-directory: compute-center
        run: python validate_dynamic_bayesian_network.py
