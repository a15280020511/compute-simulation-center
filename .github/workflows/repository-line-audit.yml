name: Full Repository Line Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-line-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-ownership-fix:
    if: github.actor == github.repository_owner && github.head_ref == 'fix/compute-artifact-ownership'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply and test Artifact ownership contract
        run: |
          set -euo pipefail
          python tools/apply_artifact_ownership_fix.py
          python -m unittest compute-center/tests/test_compute_workflow_contract.py -v

      - name: Commit reviewed repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore compute Artifact ownership after isolation"
          git push origin "HEAD:${{ github.head_ref }}"

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile deterministic audit scanner
        run: python -m py_compile tools/repository_audit.py

      - name: Inspect every repository file and source line
        run: |
          set -euo pipefail
          python tools/repository_audit.py \
            --root . \
            --output-dir audit-artifacts \
            --fail-on none

      - name: Freeze reviewed source snapshot
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=audit-artifacts \
            -czf audit-artifacts/repository-source-${GITHUB_SHA}.tar.gz .
          sha256sum audit-artifacts/repository-source-${GITHUB_SHA}.tar.gz \
            > audit-artifacts/repository-source-${GITHUB_SHA}.sha256

      - name: Upload full audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-line-audit-${{ github.run_id }}
          path: audit-artifacts/
          if-no-files-found: error
          retention-days: 30
