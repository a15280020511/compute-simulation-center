name: Apply Compute Hardening Bundle

on:
  pull_request:
    paths:
      - "tools/hardening-chunks/**"
      - "tools/apply_hardening_bundle.py"
      - ".github/workflows/repository-line-audit.yml"

permissions:
  contents: write

concurrency:
  group: apply-compute-hardening-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply and validate deterministic bundle
        run: python tools/apply_hardening_bundle.py

      - name: Commit hardened repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bundle changes to commit."
            exit 0
          fi
          git commit -m "refactor: apply audited compute hardening"
          git push origin "HEAD:${{ github.head_ref }}"
