name: Sync Transport Forecast Registry

on:
  push:
    branches: [feat/sumo-statsforecast-20260803]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-transport-forecast-registry
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Update every governance surface atomically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path(name).read_text(encoding='utf-8'))
          def save(name, value):
              Path(name).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          registry=load('compute-center/tool-registry.json')
          if not any(row.get('id')=='transport-forecast' for row in registry['groups']):
              registry['groups'].append({
                  'id':'transport-forecast',
                  'module':'transport_forecast_operations',
                  'operations':['transport_forecast_analysis'],
                  'input_validation':'mode_allowlist',
                  'default_requirements':[],
                  'mode_requirements':{
                      'sumo_micro_simulation':['requirements-sumo.txt'],
                      'statsforecast_batch':['requirements-statsforecast.txt'],
                  },
                  'network_policy':'deny',
                  'deterministic':True,
                  'maturity':'controlled-preview',
                  'resource_limits':{'max_seconds':120,'max_memory_mb':4096},
                  'rollback':{'stable_module':'transport_forecast_operations','strategy':'git-revert'},
                  'modes':{
                      'sumo_micro_simulation':{'maturity':'controlled-preview','network_policy':'deny','deterministic':True,'limits':{'max_nodes':500,'max_edges':1000,'max_routes':200,'max_flows':500,'max_seconds':120}},
                      'statsforecast_batch':{'maturity':'controlled-preview','network_policy':'deny','deterministic':True,'limits':{'max_series':100,'max_observations':50000,'max_horizon':3650,'max_models':5}},
                  },
              })
          save('compute-center/tool-registry.json',registry)

          capabilities=load('compute-center/compute-capabilities.json')
          if not any(row.get('id')=='transport_forecast_analysis' for row in capabilities['operations']):
              capabilities['operation_count'] += 1
              capabilities['managed_mode_count'] += 2
              capabilities['effective_managed_mode_count'] += 2
              capabilities['runtime_packages']['Eclipse SUMO']='1.27.1; isolated bounded road, transit and logistics micro-simulation'
              capabilities['runtime_packages']['StatsForecast']='2.1.1; bounded high-throughput statistical forecasting'
              capabilities['operations'].append({
                  'id':'transport_forecast_analysis',
                  'description':'断网执行SUMO结构化交通微观仿真与StatsForecast批量统计预测。',
                  'engine':'eclipse-sumo-statsforecast',
                  'availability':'optional-isolated-managed',
                  'requirements_by_mode':{
                      'sumo_micro_simulation':'compute-center/requirements-sumo.txt',
                      'statsforecast_batch':'compute-center/requirements-statsforecast.txt',
                  },
                  'modes':['sumo_micro_simulation','statsforecast_batch'],
                  'dependency_policy':'按模式安装仓库固定精确版本；禁止票据指定包、命令、脚本或文件路径。',
                  'limits':{'maximum_runtime_seconds':120,'maximum_memory_mb':4096,'runtime_network_policy':'deny','arbitrary_code_allowed':False,'arbitrary_paths_allowed':False,'external_control_allowed':False},
                  'maturity':'controlled-preview',
                  'required_evidence':['输入结构、单位、时间范围与频率','依赖引擎版本回执','固定随机种子或预测基准','独立验证或冻结基准后方可用于正式决策'],
              })
          save('compute-center/compute-capabilities.json',capabilities)

          matrix=load('compute-center/systems-computation-matrix.json')
          matrix['routes']['transport_forecast_analysis']={
              'problem_class':'transport-simulation-and-batch-forecasting',
              'system_level':'state-evolution',
              'feedback_structure':'traffic-flow-or-temporal-dependence',
              'required_gates':['input_quality','assumption_register','calibration','uncertainty','stress_test','external_validation','feedback_monitoring'],
          }
          save('compute-center/systems-computation-matrix.json',matrix)

          schema=load('compute-center/compute-ticket.schema.json')
          enum=schema['properties']['operation']['enum']
          if 'transport_forecast_analysis' not in enum:
              enum.append('transport_forecast_analysis')
              enum.sort()
          save('compute-center/compute-ticket.schema.json',schema)

          models=load('compute-center/model-registry.json')
          if not any(row.get('operation')=='transport_forecast_analysis' for row in models['models']):
              models['models'].append({
                  'model_id':'transport_forecast_analysis-registered-v1',
                  'operation':'transport_forecast_analysis',
                  'maturity':'controlled-preview',
                  'engineering_maturity':'controlled-preview',
                  'evidence_maturity':'experimental',
                  'risk_tier':'high',
                  'calibration_supported':True,
                  'allowed_backends':['least_squares','slsqp','differential_evolution','likelihood'],
                  'theoretical_basis':'Microscopic traffic-flow simulation through Eclipse SUMO and univariate panel forecasting through fixed StatsForecast statistical models.',
                  'prohibited_use':['Ticket-supplied commands, scripts or paths','Real-time person or vehicle tracking','External network access','Formal decisions without frozen benchmark or realized-outcome validation'],
              })
          save('compute-center/model-registry.json',models)

          path=Path('compute-center/transport_forecast_operations.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace('"sumo_binary":result.args[0]', '"sumo_version":"1.27.1"')
          text=text.replace('records=forecast.where(forecast.notna(),None).to_dict(orient="records")', 'forecast["ds"]=forecast["ds"].astype(str)\n    records=forecast.where(forecast.notna(),None).to_dict(orient="records")')
          path.write_text(text,encoding='utf-8')

          path=Path('compute-center/tests/test_tool_registry.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace('self.assertEqual(len(operations), 22)','self.assertEqual(len(operations), 23)')
          text=text.replace('"strategic_policy_analysis",\n        ):','"strategic_policy_analysis", "transport_forecast_analysis",\n        ):')
          text=text.replace('"strategic_policy_analysis": ("open_spiel_policy_evaluation", "requirements-strategy-open-spiel.txt"),','"strategic_policy_analysis": ("open_spiel_policy_evaluation", "requirements-strategy-open-spiel.txt"),\n            "transport_forecast_analysis": ("sumo_micro_simulation", "requirements-sumo.txt"),')
          text=text.replace('self.assertEqual(len(target), 28)','self.assertEqual(len(target), 29)')
          path.write_text(text,encoding='utf-8')

          path=Path('compute-center/tests/test_capability_manager_v2.py')
          text=path.read_text(encoding='utf-8')
          text=text.replace('self.assertEqual(len(groups), 12)','self.assertEqual(len(groups), 13)')
          text=text.replace('self.assertEqual(len(operations), 22)','self.assertEqual(len(operations), 23)')
          text=text.replace('"strategic_policy_analysis",\n        ):','"strategic_policy_analysis", "transport_forecast_analysis",\n        ):')
          path.write_text(text,encoding='utf-8')

          path=Path('compute-center/tests/test_governance_catalogs.py')
          text=path.read_text(encoding='utf-8').replace('report["operation_count"], 28','report["operation_count"], 29').replace('report["managed_mode_count"], 122','report["managed_mode_count"], 124')
          path.write_text(text,encoding='utf-8')

          path=Path('compute-center/tests/test_governance_v2.py')
          text=path.read_text(encoding='utf-8').replace('report["covered_operation_count"], 28','report["covered_operation_count"], 29')
          text=text.replace('"strategic_policy_analysis"):', '"strategic_policy_analysis", "transport_forecast_analysis"):')
          path.write_text(text,encoding='utf-8')

          path=Path('compute-center/validate_all_operations.py')
          text=path.read_text(encoding='utf-8')
          marker='        "strategic_policy_analysis": {"mode": "issue_tree_coverage", "root": "profit decline", "branches": [{"name": "revenue", "weight": 0.6, "evidence_count": 2}, {"name": "cost", "weight": 0.4, "evidence_count": 1}]},\n'
          addition=marker + '        "transport_forecast_analysis": {"mode": "statsforecast_batch", "frequency": "D", "horizon": 3, "season_length": 1, "models": ["Naive"], "levels": [80], "series": [{"unique_id": "region_a", "ds": f"2026-01-{day:02d}", "y": float(day)} for day in range(1, 16)]},\n'
          if '"transport_forecast_analysis":' not in text:
              if marker not in text: raise SystemExit('validate_all_operations insertion marker missing')
              text=text.replace(marker,addition)
          path.write_text(text,encoding='utf-8')

          path=Path('.github/workflows/compute-all-operations-validate.yml')
          text=path.read_text(encoding='utf-8')
          text=text.replace('            compute-center/requirements-sector-causal-econ.txt\n','            compute-center/requirements-sector-causal-econ.txt\n            compute-center/requirements-statsforecast.txt\n')
          text=text.replace('          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements-sector-causal-econ.txt\n','          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements-sector-causal-econ.txt\n          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements-statsforecast.txt\n')
          text=text.replace('Execute all 28 production operations','Execute all 29 production operations')
          text=text.replace("operation_count_expected'] == 28","operation_count_expected'] == 29")
          text=text.replace("operation_count_executed'] == 28","operation_count_executed'] == 29")
          text=text.replace("operation_summary['passed'] == 28","operation_summary['passed'] == 29")
          text=text.replace("len(operation_summary['registry']) == 28","len(operation_summary['registry']) == 29")
          text=text.replace("len(operation_summary['rows']) == 28","len(operation_summary['rows']) == 29")
          text=text.replace("'operations': 28","'operations': 29")
          path.write_text(text,encoding='utf-8')
          PY
      - name: Install registry validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
      - name: Validate all contracts before commit
        working-directory: compute-center
        run: |
          python -m py_compile *.py tests/*.py
          python capability_manager.py validate
          python systems_matrix.py validate
          python governance_catalog.py
          python -m unittest tests.test_capability_manager_v2 tests.test_tool_registry tests.test_governance_catalogs tests.test_governance_v2
          git -C .. diff --check
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/transport-forecast-registry-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: register SUMO and StatsForecast compute capability'
          git push origin HEAD:feat/sumo-statsforecast-20260803
