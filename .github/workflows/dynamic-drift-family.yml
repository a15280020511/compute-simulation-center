name: Validate Dynamic Drift Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_drift_planner.py"
      - "compute-center/dynamic_drift_adapters.py"
      - "compute-center/dynamic-drift-policy.json"
      - "compute-center/dynamic-drift-capability-graph.json"
      - "compute-center/dynamic-drift-stage-contracts.json"
      - "compute-center/drift_registry.py"
      - "compute-center/operation_validation.py"
      - "compute-center/institutional-expansion-mode-registry.json"
      - "compute-center/institutional_expansion_operations.py"
      - "compute-center/think_tank_econometric_operations.py"
      - "compute-center/requirements-institutional-evidently.txt"
      - "compute-center/requirements-institutional-river.txt"
      - "compute-center/requirements-thinktank-econometrics.txt"
      - "compute-center/validate_dynamic_drift.py"
      - "compute-center/tests/test_dynamic_drift_family.py"
      - "compute-center/tests/test_dynamic_family_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-drift-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-institutional-evidently.txt
            compute-center/requirements-institutional-river.txt
            compute-center/requirements-thinktank-econometrics.txt
      - name: Install core and isolated drift-analysis dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt \
            -r compute-center/requirements-institutional-evidently.txt \
            -r compute-center/requirements-institutional-river.txt \
            -r compute-center/requirements-thinktank-econometrics.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          assert version("evidently") == "0.7.21"
          assert version("river") == "0.25.0"
          assert version("ruptures") == "1.1.10"
          PY
      - name: Compile drift dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            drift_registry.py \
            dynamic_drift_adapters.py \
            dynamic_drift_planner.py \
            operation_validation.py \
            institutional_expansion_operations.py \
            think_tank_econometric_operations.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            tool_registry.py \
            validate_dynamic_drift.py \
            tests/test_dynamic_drift_family.py \
            tests/test_dynamic_family_router_coexistence.py
      - name: Run drift and existing dynamic-family regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_dynamic*.py' -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for drift family
        working-directory: compute-center
        run: python validate_dynamic_drift.py
