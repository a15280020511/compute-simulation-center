name: One-shot PR41 Consistency Fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: maintenance-pr41-consistency-fix
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-pr41-consistency-fix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TARGET_BRANCH: feat/global-think-tank-toolkit-20260803
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Patch stale expectations and cache inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          decision = Path('compute-center/tests/test_decision_intelligence_gateway.py')
          text = decision.read_text(encoding='utf-8')
          text = text.replace('self.assertEqual(len(THINK_TANK_MODES), 38)', 'self.assertEqual(len(THINK_TANK_MODES), 53)')
          text = text.replace('self.assertEqual(len(ALL_SUPPORTED_MODES), 60)', 'self.assertEqual(len(ALL_SUPPORTED_MODES), 75)')
          decision.write_text(text, encoding='utf-8')

          governance = Path('compute-center/tests/test_governance_catalogs.py')
          text = governance.read_text(encoding='utf-8')
          text = text.replace('self.assertEqual(report["installed_method_pack_count"], 18)', 'self.assertEqual(report["installed_method_pack_count"], 19)')
          governance.write_text(text, encoding='utf-8')

          ticket = Path('.github/workflows/compute-ticket.yml')
          text = ticket.read_text(encoding='utf-8')
          anchor = '            compute-center/requirements-thinktank-geospatial.txt\n'
          additions = ''.join(f'            compute-center/{name}\n' for name in [
              'requirements-global-aequilibrae.txt',
              'requirements-global-arch.txt',
              'requirements-global-control.txt',
              'requirements-global-econml.txt',
              'requirements-global-epydemix.txt',
              'requirements-global-lmfit.txt',
              'requirements-global-mapie.txt',
              'requirements-global-openturns.txt',
              'requirements-global-pm4py.txt',
              'requirements-global-pydoe3.txt',
              'requirements-global-pysd.txt',
              'requirements-global-rsome.txt',
              'requirements-global-skgstat.txt',
              'requirements-global-smt.txt',
              'requirements-global-spreg.txt',
          ])
          if 'compute-center/requirements-global-aequilibrae.txt' not in text:
              if anchor not in text:
                  raise RuntimeError('compute-ticket cache anchor not found')
              text = text.replace(anchor, anchor + additions, 1)
          ticket.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched consistency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m py_compile compute-center/tests/test_decision_intelligence_gateway.py compute-center/tests/test_governance_catalogs.py compute-center/maintenance_audit.py
          python -m unittest \
            compute-center/tests/test_decision_intelligence_gateway.py \
            compute-center/tests/test_governance_catalogs.py
          python compute-center/maintenance_audit.py --root . --output /tmp/maintenance-audit.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/maintenance-audit.json', encoding='utf-8'))
          assert data['configuration']['status'] == 'PASS', data
          PY
          git diff --check

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compute-center/tests/test_decision_intelligence_gateway.py \
                  compute-center/tests/test_governance_catalogs.py \
                  .github/workflows/compute-ticket.yml
          if git diff --cached --quiet; then
            echo 'No changes required'
          else
            git commit -m 'fix: synchronize global toolkit governance expectations'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Publish result
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'PR41_CONSISTENCY_FIX_PASS: updated mode and method-pack expectations and added all global requirement packs to the compute-ticket cache inventory.'
