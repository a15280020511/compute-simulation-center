name: Certified Math Validate

on:
  pull_request:
    paths:
      - "compute-center/certified_math_task.py"
      - "compute-center/certified-math-ticket.schema.json"
      - "compute-center/certified-math-capabilities.json"
      - "compute-center/requirements-certified-math.txt"
      - "compute-center/tests/test_certified_math_task.py"
      - ".github/workflows/certified-math-*.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/certified_math_task.py"
      - "compute-center/certified-math-ticket.schema.json"
      - "compute-center/certified-math-capabilities.json"
      - "compute-center/requirements-certified-math.txt"
      - "compute-center/tests/test_certified_math_task.py"
      - ".github/workflows/certified-math-*.yml"

permissions:
  contents: read

concurrency:
  group: certified-math-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements-certified-math.txt

      - name: Install pinned certified dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements-certified-math.txt
          python -m pip check

      - name: Compile
        run: python -m py_compile compute-center/certified_math_task.py

      - name: Unit and end-to-end tests
        run: python -m unittest compute-center/tests/test_certified_math_task.py -v

      - name: Verify network-deny contract and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('compute-center')
          schema = json.loads((root / 'certified-math-ticket.schema.json').read_text(encoding='utf-8'))
          catalog = json.loads((root / 'certified-math-capabilities.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          assert catalog['network_policy'] == 'deny'
          assert catalog['governance']['network_calls_allowed'] is False
          assert catalog['governance']['arbitrary_code_allowed'] is False
          assert catalog['governance']['model_calls'] == 0
          print('certified math governance validation passed')
          PY
