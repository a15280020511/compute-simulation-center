name: Temporary Finalize SageMath Capability

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-finalize-sagemath-capability
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.title == '[maintenance] finalize sagemath non-workflow files 20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/sagemath-capability-20260804
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Register, validate and commit non-workflow files
        id: finalize
        continue-on-error: true
        run: |
          set +e
          exec > >(tee /tmp/sagemath-finalizer.log) 2>&1
          echo 'STAGE=register'
          python maintenance/register_sagemath_capability.py || exit $?

          echo 'STAGE=cleanup_non_workflow'
          rm -f \
            maintenance/apply_sagemath_capability.py \
            maintenance/apply_sagemath_capability.fixed.py \
            maintenance/repair_and_apply_sagemath.py \
            maintenance/register_sagemath_capability.py \
            maintenance/integrate_sagemath_workflow.py \
            maintenance/sagemath-migration-diagnostics.txt

          echo 'STAGE=install'
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt || exit $?
          python -m pip check || exit $?

          echo 'STAGE=static_validation'
          python -m py_compile compute-center/sagemath_operations.py compute-center/tool_registry.py compute-center/systems_matrix.py || exit $?
          python -m unittest discover -s compute-center/tests -p 'test_sagemath_operations.py' -v || exit $?
          python compute-center/tool_registry.py validate || exit $?
          python compute-center/systems_matrix.py validate || exit $?
          python - <<'PY'
          import json
          registry=json.load(open('compute-center/tool-registry.json'))
          groups={row['id']:row for row in registry['groups']}
          group=groups['sagemath-symbolic']
          assert group['operations']==['symbolic_mathematics']
          assert set(group['modes'])=={'simplify','solve','differentiate','integrate','matrix_analysis','number_theory'}
          assert group['network_policy']=='deny'
          caps=json.load(open('compute-center/compute-capabilities.json'))
          assert caps['operation_count']==30
          assert caps['managed_mode_count']==130
          assert caps['effective_managed_mode_count']==191
          assert any(row['id']=='symbolic_mathematics' for row in caps['operations'])
          matrix=json.load(open('compute-center/systems-computation-matrix.json'))
          assert 'symbolic_mathematics' in matrix['routes']
          runtime=json.load(open('compute-center/sagemath-runtime.json'))
          assert runtime['image']=='sagemath/sagemath@sha256:e068670ae5863b54b2550e72437ec637b0283acb0dc712c8584c124dbf44e667'
          PY
          git diff --check || exit $?

          echo 'STAGE=commit_non_workflow'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compute-center maintenance
          git diff --cached --quiet && { echo 'No non-workflow finalization changes found'; exit 41; }
          git commit -m 'feat: finalize SageMath registry and capability contracts' || exit $?
          git push origin HEAD:feat/sagemath-capability-20260804 || exit $?
          exit 0
      - name: Publish diagnostic outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.finalize.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Finalizer outcome: $OUTCOME"
            echo "Run: $RUN_URL"
            echo
            echo '```text'
            tail -n 140 /tmp/sagemath-finalizer.log 2>/dev/null || true
            echo '```'
          } > /tmp/comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
          if [[ "$OUTCOME" == "success" ]]; then
            gh issue close "${{ github.event.issue.number }}" --reason completed
          fi
      - name: Fail closed
        if: steps.finalize.outcome != 'success'
        run: exit 1
