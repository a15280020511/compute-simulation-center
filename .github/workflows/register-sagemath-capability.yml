name: Register SageMath Capability

on:
  push:
    branches: [feat/sagemath-capability-20260804]
    paths:
      - maintenance/register_sagemath_capability.py
      - .github/workflows/register-sagemath-capability.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: register-sagemath-capability
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/sagemath-capability-20260804
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Register formal capability contracts
        run: python maintenance/register_sagemath_capability.py
      - name: Validate generated registry and fixture surface
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m py_compile compute-center/sagemath_operations.py
          python -m unittest discover -s compute-center/tests -p 'test_sagemath_operations.py' -v
          python compute-center/tool_registry.py validate
          python compute-center/systems_matrix.py validate
          git diff --check
      - name: Commit registry integration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compute-center/tool-registry.json compute-center/compute-capabilities.json compute-center/systems-computation-matrix.json
          if git diff --cached --quiet; then
            echo 'No registry changes generated'
            exit 1
          fi
          git commit -m 'feat: register SageMath symbolic operation and modes'
          git push origin HEAD:feat/sagemath-capability-20260804
