name: Validate Sector Model Toolkit

on:
  pull_request:
    paths:
      - "compute-center/sector_model_operations.py"
      - "compute-center/validate_sector_model_pack.py"
      - "compute-center/requirements-sector-*.txt"
      - "compute-center/tool-registry.json"
      - "compute-center/compute-capabilities.json"
      - "compute-center/method-registry.json"
      - "compute-center/systems-computation-matrix.json"
      - ".github/workflows/sector-model-toolkit-validate.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/sector_model_operations.py"
      - "compute-center/validate_sector_model_pack.py"
      - "compute-center/requirements-sector-*.txt"
      - "compute-center/tool-registry.json"
      - "compute-center/compute-capabilities.json"
      - "compute-center/method-registry.json"
      - "compute-center/systems-computation-matrix.json"

permissions:
  contents: read

concurrency:
  group: sector-model-toolkit-${{ github.ref }}-${{ matrix.mode }}
  cancel-in-progress: true

jobs:
  validate-mode:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: doubleml_plr
            requirements: requirements-sector-causal-econ.txt
          - mode: quantecon_markov_chain
            requirements: requirements-sector-causal-econ.txt
          - mode: nash_bimatrix_equilibria
            requirements: requirements-sector-causal-econ.txt
          - mode: ema_robust_regret
            requirements: requirements-sector-causal-econ.txt
          - mode: pypsa_linear_power_flow
            requirements: requirements-sector-energy.txt
          - mode: pandapower_ac_power_flow
            requirements: requirements-sector-grid.txt
          - mode: wntr_hydraulic_snapshot
            requirements: requirements-sector-water.txt
          - mode: pywr_resource_allocation
            requirements: requirements-sector-water.txt
          - mode: gstools_random_field
            requirements: requirements-sector-geostat.txt
          - mode: pykrige_interpolation
            requirements: requirements-sector-geostat.txt
          - mode: brightway_matrix_lca
            requirements: requirements-sector-lca.txt
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/${{ matrix.requirements }}

      - name: Install one isolated dependency bundle
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/${{ matrix.requirements }}
          python -m pip check

      - name: Compile controlled runtime
        run: python -m py_compile compute-center/sector_model_operations.py compute-center/validate_sector_model_pack.py

      - name: Execute numerical smoke test
        run: |
          mkdir -p sector-model-artifacts
          python compute-center/validate_sector_model_pack.py \
            --mode "${{ matrix.mode }}" \
            --output "sector-model-artifacts/${{ matrix.mode }}.json"

      - name: Upload safe validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sector-model-${{ matrix.mode }}-${{ github.run_id }}
          path: sector-model-artifacts/
          if-no-files-found: error
          retention-days: 30
