name: Finalize Strategic Policy Catalogs

on:
  pull_request:
    paths:
      - "compute-center/finalize_strategic_policy_catalogs.py"
      - ".github/workflows/sector-model-toolkit-validate.yml"

permissions:
  contents: write

concurrency:
  group: finalize-strategic-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install core dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check

      - name: Generate synchronized catalogs
        run: python compute-center/finalize_strategic_policy_catalogs.py

      - name: Validate synchronized catalogs and fixture parity
        run: |
          set -euo pipefail
          python -m py_compile \
            compute-center/finalize_strategic_policy_catalogs.py \
            compute-center/validate_all_operations.py
          python compute-center/governance_catalog.py > /tmp/governance.json
          python compute-center/capability_manager.py validate > /tmp/capabilities.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/governance.json'))['status'] == 'PASS'
          assert json.load(open('/tmp/capabilities.json'))['status'] == 'PASS'
          PY
          git diff --check

      - name: Commit generated non-workflow files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compute-center/compute-ticket.schema.json \
                  compute-center/model-registry.json \
                  compute-center/validate_all_operations.py
          if git diff --cached --quiet; then
            echo 'No catalog changes remain.'
          else
            git commit -m 'fix: synchronize strategic policy governance catalogs'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
