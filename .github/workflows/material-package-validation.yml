name: Validate Complete Material Packages

on:
  pull_request:
    paths:
      - "compute-center/material_package_validation.py"
      - "compute-center/complete-material-package-contract.json"
      - "compute-center/tests/test_material_package_validation.py"
      - ".github/workflows/material-package-validation.yml"
  push:
    branches: [main]
    paths:
      - "compute-center/material_package_validation.py"
      - "compute-center/complete-material-package-contract.json"
      - "compute-center/tests/test_material_package_validation.py"
      - ".github/workflows/material-package-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-material-package-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-complete-material-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: compute-center/requirements.txt
      - name: Install pinned core dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check
      - name: Compile and run deep package validation tests
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile material_package_validation.py
          python -m unittest tests.test_material_package_validation -v
      - name: Prove offline validation boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('compute-center/material_package_validation.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          forbidden_modules = {
              'urllib', 'requests', 'httpx', 'socket', 'huggingface_hub',
              'subprocess', 'ftplib', 'telnetlib', 'webbrowser',
          }
          imports = set()
          dangerous_calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
              elif isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  if node.func.id in {'eval', 'exec', 'compile', '__import__'}:
                      dangerous_calls.add(node.func.id)
          blocked_imports = sorted(imports & forbidden_modules)
          if blocked_imports:
              raise SystemExit(f'forbidden network/process imports: {blocked_imports}')
          if dangerous_calls:
              raise SystemExit(f'forbidden dynamic execution calls: {sorted(dangerous_calls)}')
          print('offline validator AST boundary: PASS')
          PY
