name: Patch Final Dependency Cache

on:
  pull_request:
    paths:
      - "compute-center/patch_final_dependency_cache.py"
      - ".github/workflows/patch-final-dependency-cache.yml"

permissions:
  contents: write

concurrency:
  group: patch-final-dependency-cache-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply deterministic cache patch
        run: python compute-center/patch_final_dependency_cache.py

      - name: Validate exact cache coverage
        run: |
          set -euo pipefail
          python -m py_compile compute-center/patch_final_dependency_cache.py
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/compute-ticket.yml').read_text(encoding='utf-8')
          required = (
              'compute-center/requirements-final-mlxtend.txt',
              'compute-center/requirements-final-pymdp.txt',
              'compute-center/requirements-final-pyod.txt',
              'compute-center/requirements-final-quantlib.txt',
          )
          for item in required:
              assert source.count(item) == 1, item
          PY
          git diff --check

      - name: Commit cache inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/compute-ticket.yml
          if git diff --cached --quiet; then
            echo "cache inventory already synchronized"
            exit 0
          fi
          git commit -m "fix: include final dependency packs in compute cache"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
