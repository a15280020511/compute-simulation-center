name: Validate Dynamic Global Sensitivity Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_global_sensitivity_planner.py"
      - "compute-center/dynamic_global_sensitivity_adapters.py"
      - "compute-center/dynamic-global-sensitivity-policy.json"
      - "compute-center/dynamic-global-sensitivity-capability-graph.json"
      - "compute-center/dynamic-global-sensitivity-stage-contracts.json"
      - "compute-center/professional_forecasting_operations.py"
      - "compute-center/requirements-global-salib.txt"
      - "compute-center/validate_dynamic_global_sensitivity.py"
      - "compute-center/tests/test_dynamic_global_sensitivity_family.py"
      - "compute-center/tests/test_dynamic_global_sensitivity_router_coexistence.py"
      - ".github/workflows/compute-ticket.yml"
      - ".github/workflows/dynamic-global-sensitivity-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-global-sensitivity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-global-salib.txt
      - name: Install core and sensitivity dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt \
            -r compute-center/requirements-global-salib.txt
          python -m pip check
          python - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.python_version_tuple()[:2] == ("3", "12")
          assert version("ortools") == "9.15.6755"
          assert version("networkx") == "3.6.1"
          assert version("SALib") == "1.5.2"
          assert version("numpy") == "2.4.6"
          PY
      - name: Compile global-sensitivity dynamic family
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_global_sensitivity_adapters.py \
            dynamic_global_sensitivity_planner.py \
            professional_forecasting_operations.py \
            pipeline_adapters.py \
            compute_dispatch.py \
            operation_validation.py \
            validate_dynamic_global_sensitivity.py \
            tests/test_dynamic_global_sensitivity_family.py \
            tests/test_dynamic_global_sensitivity_router_coexistence.py
      - name: Run sensitivity and existing lightweight dynamic regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_dynamic*.py' -v
      - name: Validate capability registry
        working-directory: compute-center
        run: python tool_registry.py validate
      - name: Verify real production dispatcher route for global-sensitivity family
        working-directory: compute-center
        run: python validate_dynamic_global_sensitivity.py
