name: One Shot Sector Model Assembly

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: one-shot-sector-model-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[maintenance-sector-model-assemble]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      FEATURE_BRANCH: feat/sector-model-toolkit-20260803
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/sector-model-toolkit-20260803
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Assemble registries and deterministic contracts
        run: |
          set -euo pipefail
          python .maintenance/assemble_sector_model_toolkit.py
          python .maintenance/add_sector_ticket_schema.py

      - name: Install bounded assembly environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-sector-causal-econ.txt
          python -m pip check

      - name: Compile and validate control plane
        run: |
          set -euo pipefail
          python -m py_compile compute-center/*.py compute-center/tests/*.py
          python compute-center/capability_manager.py validate
          python compute-center/systems_matrix.py validate
          python compute-center/governance_catalog.py
          python compute-center/think_tank_registry_validate.py

      - name: Run targeted catalog and runtime regressions
        run: |
          set -euo pipefail
          python -m unittest \
            compute-center/tests/test_governance_catalogs.py \
            compute-center/tests/test_governance_v2.py \
            compute-center/tests/test_think_tank_operations.py
          mkdir -p sector-model-assembly-artifacts
          python compute-center/validate_sector_model_pack.py \
            --mode nash_bimatrix_equilibria \
            --output sector-model-assembly-artifacts/nash_bimatrix_equilibria.json
          git diff --check

      - name: Commit ordinary source and generated catalogs
        run: |
          set -euo pipefail
          git restore .github/workflows/compute-all-operations-validate.yml
          rm -rf .maintenance
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: register isolated sector-model toolkit"
          git push origin HEAD:${FEATURE_BRANCH}

      - name: Report success
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "SECTOR_MODEL_ASSEMBLY_PASS"

      - name: Report failure
        if: failure()
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "SECTOR_MODEL_ASSEMBLY_FAILED run=${GITHUB_RUN_ID}"
