name: One-shot assurance math compatibility fix

on:
  push:
    branches:
      - feat/exa-thinktank-tool-expansion-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/exa-thinktank-tool-expansion-v2
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('compute-center/think_tank_specialized_assurance.py')
          source=path.read_text(encoding='utf-8')
          if 'import math\n' not in source:
              source=source.replace('from __future__ import annotations\n', 'from __future__ import annotations\n\nimport math\n', 1)
          source=source.replace('np.math.gamma(1 + 1 / beta)', 'math.gamma(1 + 1 / beta)')
          path.write_text(source,encoding='utf-8')
          PY
          python -m py_compile compute-center/think_tank_specialized_assurance.py
          rm .github/workflows/self-patch-assurance-math.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compute-center/think_tank_specialized_assurance.py .github/workflows/self-patch-assurance-math.yml
          git commit -m 'fix: use standard-library gamma in reliability fallback'
          git push origin HEAD:feat/exa-thinktank-tool-expansion-v2
