name: Validate Dynamic Causal DID Family

on:
  pull_request:
    paths:
      - "compute-center/dynamic_family_router.py"
      - "compute-center/dynamic_causal_did_planner.py"
      - "compute-center/dynamic-causal-did-policy.json"
      - "compute-center/dynamic-causal-did-capability-graph.json"
      - "compute-center/pipeline_adapters.py"
      - "compute-center/operation-contract-registry.json"
      - "compute-center/tool_registry.py"
      - "compute-center/validate_dynamic_causal_did.py"
      - "compute-center/validate_dynamic_time_series.py"
      - "compute-center/tests/test_dynamic_causal_did_family.py"
      - ".github/workflows/dynamic-causal-did-family.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-causal-did-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compute-center/requirements.txt
            compute-center/requirements-ortools.txt
            compute-center/requirements-causal.txt
      - name: Install core, optimization, and isolated causal dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            -r compute-center/requirements.txt \
            -r compute-center/requirements-ortools.txt \
            -r compute-center/requirements-causal.txt
          python -m pip check
      - name: Compile causal family runtime
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m py_compile \
            dynamic_family_router.py \
            dynamic_causal_did_planner.py \
            dynamic_time_series_planner.py \
            dynamic_pipeline_planner.py \
            pipeline_adapters.py \
            tool_registry.py \
            validate_dynamic_causal_did.py \
            validate_dynamic_time_series.py
      - name: Run causal, time-series, and scenario-family regressions
        working-directory: compute-center
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_dynamic_causal_did_family \
            tests.test_dynamic_time_series_family \
            tests.test_dynamic_pipeline_planner \
            tests.test_dynamic_runtime_integration \
            tests.test_dynamic_generic_extensions -v
      - name: Verify causal DID production dispatcher route
        working-directory: compute-center
        run: python validate_dynamic_causal_did.py
      - name: Re-verify time-series dispatcher route after family metadata extension
        working-directory: compute-center
        run: python validate_dynamic_time_series.py
