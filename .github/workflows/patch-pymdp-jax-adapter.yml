name: Patch PyMDP JAX Adapter

on:
  pull_request:
    paths:
      - "compute-center/patch_pymdp_jax_adapter.py"
      - ".github/workflows/patch-pymdp-jax-adapter.yml"

permissions:
  contents: write

concurrency:
  group: patch-pymdp-jax-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply deterministic adapter migration
        run: python compute-center/patch_pymdp_jax_adapter.py

      - name: Validate source and governance guards
        run: |
          set -euo pipefail
          python -m py_compile \
            compute-center/behavior_finance_intelligence_operations.py \
            compute-center/patch_pymdp_jax_adapter.py
          python - <<'PY'
          from pathlib import Path
          source = Path('compute-center/behavior_finance_intelligence_operations.py').read_text(encoding='utf-8')
          assert 'utils.obj_array' not in source
          assert 'sample_action(' not in source
          assert 'infer_states(' in source
          assert 'empirical_prior=agent.D' in source
          assert 'infer_policies(posterior_states)' in source
          PY
          git diff --check

      - name: Commit adapter migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compute-center/behavior_finance_intelligence_operations.py
          if git diff --cached --quiet; then
            echo "adapter already migrated"
            exit 0
          fi
          git commit -m "fix: migrate active inference adapter to pymdp JAX API"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
