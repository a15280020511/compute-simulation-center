name: Commit Strategic Policy Registration

on:
  pull_request:
    paths:
      - "compute-center/register_strategic_policy_pack.py"
      - "compute-center/strategic_policy_intelligence_operations.py"
      - "compute-center/requirements-strategy-*.txt"
      - "compute-center/requirements-policy-*.txt"
      - "compute-center/requirements-intelligence-*.txt"
      - "compute-center/requirements-graph-*.txt"
      - ".github/workflows/global-think-tank-toolkit-validate.yml"

permissions:
  contents: write

concurrency:
  group: strategic-policy-registration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  register:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install control-plane baseline
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check

      - name: Generate registered control plane
        run: python compute-center/register_strategic_policy_pack.py

      - name: Validate generated files
        run: |
          set -euo pipefail
          python -m py_compile \
            compute-center/strategic_policy_intelligence_operations.py \
            compute-center/register_strategic_policy_pack.py \
            compute-center/think_tank_global_operations.py
          python compute-center/capability_manager.py validate > /tmp/capability-manager.json
          python compute-center/systems_matrix.py validate > /tmp/systems-matrix.json
          python compute-center/maintenance_audit.py --root . --output /tmp/maintenance-audit.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/capability-manager.json'))['status'] == 'PASS'
          assert json.load(open('/tmp/systems-matrix.json'))['status'] == 'PASS'
          assert json.load(open('/tmp/maintenance-audit.json'))['configuration']['status'] == 'PASS'
          PY
          git diff --check

      - name: Commit non-workflow registration files
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree \
            .github/workflows/compute-ticket.yml \
            .github/workflows/global-think-tank-toolkit-validate.yml \
            .github/workflows/strategic-policy-candidate-compatibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compute-center/tool-registry.json \
                  compute-center/compute-capabilities.json \
                  compute-center/systems-computation-matrix.json \
                  compute-center/think_tank_global_operations.py \
                  compute-center/strategic_policy_intelligence_operations.py
          if git diff --cached --quiet; then
            echo 'No generated non-workflow changes remain.'
          else
            git commit -m 'feat: register strategic policy intelligence capability pack'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
