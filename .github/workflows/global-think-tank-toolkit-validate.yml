name: Validate Strategic Policy Intelligence Toolkit

on:
  pull_request:
    paths:
      - "compute-center/strategic_policy_intelligence_operations.py"
      - "compute-center/validate_strategic_policy_pack.py"
      - "compute-center/requirements-strategy-*.txt"
      - "compute-center/requirements-policy-*.txt"
      - "compute-center/requirements-intelligence-*.txt"
      - "compute-center/requirements-graph-*.txt"
      - ".github/workflows/global-think-tank-toolkit-validate.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: strategic-policy-mode-${{ github.ref }}-${{ matrix.mode }}
  cancel-in-progress: true

jobs:
  validate-mode:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: open_spiel_policy_evaluation, requirements: requirements-strategy-open-spiel.txt}
          - {mode: pygambit_pure_equilibria, requirements: requirements-strategy-pygambit.txt}
          - {mode: axelrod_strategy_tournament, requirements: requirements-strategy-axelrod.txt}
          - {mode: negmas_bilateral_bargaining, requirements: requirements-strategy-negmas.txt}
          - {mode: scml_supply_chain_competition, requirements: requirements-strategy-scml.txt}
          - {mode: pyblp_price_counterfactual, requirements: requirements-strategy-pyblp.txt}
          - {mode: pymc_marketing_budget_allocation, requirements: requirements-strategy-pymc-marketing.txt}
          - {mode: biogeme_choice_share, requirements: requirements-strategy-biogeme.txt}
          - {mode: pyagrum_bayesian_evidence, requirements: requirements-strategy-pyagrum.txt}
          - {mode: scikit_criteria_method_agreement, requirements: requirements-strategy-scikit-criteria.txt}
          - {mode: clingo_rule_action_set, requirements: requirements-strategy-clingo.txt}
          - {mode: z3_constraint_counterexample, requirements: requirements-strategy-z3.txt}
          - {mode: hark_household_policy_response, requirements: requirements-policy-econ-ark.txt}
          - {mode: taxcalc_policy_counterfactual, requirements: requirements-policy-taxcalc.txt}
          - {mode: policyengine_transfer_counterfactual, requirements: requirements-policy-policyengine.txt}
          - {mode: splink_entity_resolution, requirements: requirements-intelligence-splink.txt}
          - {mode: rapidfuzz_record_collision, requirements: requirements-intelligence-rapidfuzz.txt}
          - {mode: datasketch_set_similarity, requirements: requirements-intelligence-datasketch.txt}
          - {mode: rdflib_claim_evidence_graph, requirements: requirements-graph-rdflib.txt}
          - {mode: pyshacl_graph_validation, requirements: requirements-graph-pyshacl.txt}
          - {mode: owlready2_ontology_summary, requirements: requirements-graph-owlready2.txt}
          - {mode: igraph_link_analysis, requirements: requirements-graph-igraph.txt}
          - {mode: problog_evidence_probability, requirements: requirements-intelligence-problog.txt}
          - {mode: issue_tree_coverage, requirements: ""}
          - {mode: value_driver_tree, requirements: ""}
          - {mode: source_reliability_matrix, requirements: ""}
          - {mode: claim_evidence_contradiction, requirements: ""}
          - {mode: event_timeline_collision, requirements: ""}
          - {mode: red_team_challenge_matrix, requirements: ""}
          - {mode: net_assessment_balance, requirements: ""}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install isolated mode dependency pack
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          if [[ -n "$REQUIREMENTS" ]]; then
            python -m pip install --disable-pip-version-check --no-input \
              --upgrade-strategy only-if-needed -r "compute-center/$REQUIREMENTS"
          fi
          python -m pip check
          python - <<'PY'
          import numpy, scipy
          assert numpy.__version__ == '2.4.6', numpy.__version__
          assert scipy.__version__ == '1.18.0', scipy.__version__
          PY

      - name: Compile governed runtime
        run: |
          python -m py_compile \
            compute-center/strategic_policy_intelligence_operations.py \
            compute-center/validate_strategic_policy_pack.py

      - name: Execute fixed offline numerical fixture
        run: |
          set -euo pipefail
          mkdir -p strategic-policy-artifacts
          python compute-center/validate_strategic_policy_pack.py \
            --mode "${{ matrix.mode }}" \
            --output "strategic-policy-artifacts/${{ matrix.mode }}.json"

      - name: Verify governance evidence contract
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          mode = os.environ['MODE']
          data = json.loads((Path('strategic-policy-artifacts') / f'{mode}.json').read_text(encoding='utf-8'))
          assert data['status'] == 'PASS'
          assert data['mode'] == mode
          assert data['network_used'] is False
          assert data['arbitrary_code_used'] is False
          source = Path('compute-center/strategic_policy_intelligence_operations.py').read_text(encoding='utf-8')
          for forbidden in ('import requests', 'import socket', 'urllib.request', 'subprocess.', 'eval(', 'exec('):
              assert forbidden not in source
          PY

      - name: Upload mode evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategic-policy-${{ matrix.mode }}-${{ github.run_id }}
          path: strategic-policy-artifacts/
          if-no-files-found: warn
          retention-days: 30

  publish-receipt:
    if: always()
    needs: [validate-mode]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish matrix receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.validate-mode.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$RESULT" == "success" ]]; then
            status='STRATEGIC_POLICY_MODE_MATRIX_PASS'
          else
            status='STRATEGIC_POLICY_MODE_MATRIX_FAIL'
          fi
          marker="<!-- strategic-policy-matrix-run:${GITHUB_RUN_ID} -->"
          body=$(printf '%s\n## %s\n\n- Modes: `30`\n- Matrix result: `%s`\n- Run ID: `%s`\n- Network in fixtures: `denied / unused`\n- Arbitrary code: `false`\n- Model calls: `0`\n' "$marker" "$status" "$RESULT" "$GITHUB_RUN_ID")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"
          [[ "$RESULT" == "success" ]]
