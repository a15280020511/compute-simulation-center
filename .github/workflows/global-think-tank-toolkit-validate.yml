name: Generate Strategic Policy Registration

on:
  pull_request:
    paths:
      - "compute-center/register_strategic_policy_pack.py"
      - "compute-center/strategic_policy_intelligence_operations.py"
      - "compute-center/requirements-strategy-*.txt"
      - "compute-center/requirements-policy-*.txt"
      - "compute-center/requirements-intelligence-*.txt"
      - "compute-center/requirements-graph-*.txt"
      - ".github/workflows/global-think-tank-toolkit-validate.yml"

permissions:
  contents: read

concurrency:
  group: strategic-policy-registration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install control-plane baseline
        run: |
          python -m pip install --disable-pip-version-check --no-input -r compute-center/requirements.txt
          python -m pip check

      - name: Generate registered control plane
        run: python compute-center/register_strategic_policy_pack.py

      - name: Validate generated files
        run: |
          set -euo pipefail
          python -m py_compile \
            compute-center/strategic_policy_intelligence_operations.py \
            compute-center/register_strategic_policy_pack.py \
            compute-center/think_tank_global_operations.py
          python compute-center/capability_manager.py validate > registration-capability-manager.json
          python compute-center/systems_matrix.py validate > registration-systems-matrix.json
          python compute-center/maintenance_audit.py --root . --output registration-maintenance-audit.json
          python - <<'PY'
          import json
          assert json.load(open('registration-capability-manager.json'))['status'] == 'PASS'
          assert json.load(open('registration-systems-matrix.json'))['status'] == 'PASS'
          assert json.load(open('registration-maintenance-audit.json'))['configuration']['status'] == 'PASS'
          PY
          git diff --check

      - name: Stage generated registration files
        run: |
          set -euo pipefail
          mkdir -p registration-artifact/compute-center registration-artifact/.github/workflows
          cp compute-center/tool-registry.json registration-artifact/compute-center/
          cp compute-center/compute-capabilities.json registration-artifact/compute-center/
          cp compute-center/systems-computation-matrix.json registration-artifact/compute-center/
          cp compute-center/think_tank_global_operations.py registration-artifact/compute-center/
          cp compute-center/strategic_policy_intelligence_operations.py registration-artifact/compute-center/
          cp .github/workflows/compute-ticket.yml registration-artifact/.github/workflows/
          cp .github/workflows/global-think-tank-toolkit-validate.yml registration-artifact/.github/workflows/
          cp registration-capability-manager.json registration-artifact/
          cp registration-systems-matrix.json registration-artifact/
          cp registration-maintenance-audit.json registration-artifact/

      - name: Upload generated registration artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategic-policy-registration-${{ github.run_id }}
          path: registration-artifact/
          if-no-files-found: error
          retention-days: 14
